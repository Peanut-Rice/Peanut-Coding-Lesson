<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星光琴键：童话魔法乐章</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #a855f7;
            --secondary: #ec4899;
            --accent: #3b82f6;
            --bg-gradient: radial-gradient(circle at center, #11092c 0%, #050212 100%);
            --panel-bg: rgba(15, 10, 36, 0.65);
            --key-bg: rgba(15, 10, 36, 0.8);
            --key-border: rgba(168, 85, 247, 0.2);
            --shadow-glow: 0 0 20px rgba(168, 85, 247, 0.6);
            --text-highlight: #a855f7;
        }

        body {
            font-family: 'Comfortaa', 'Noto Sans SC', 'Microsoft YaHei', cursive, sans-serif;
            background: var(--bg-gradient);
            overflow-x: hidden;
            transition: background 0.8s ease, color 0.3s ease;
        }
        
        .jetbrains-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .neon-glow {
            box-shadow: var(--shadow-glow);
            transition: box-shadow 0.5s ease;
        }

        .panel-glass {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        .key-glass {
            background: var(--key-bg);
            border: 1px solid var(--key-border);
            transition: all 0.1s ease, background 0.8s ease, border-color 0.8s ease;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 琴键激活特效 */
        .key-active {
            transform: scale(0.9) translateY(3px) !important;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%) !important;
            box-shadow: 0 0 20px var(--secondary) !important;
            border-color: transparent !important;
            color: #ffffff !important;
        }

        /* 呼吸等待按键特效 */
        @keyframes keyPulse {
            0%, 100% { box-shadow: 0 0 5px var(--accent), inset 0 0 5px var(--accent); filter: brightness(1); }
            50% { box-shadow: 0 0 22px var(--accent), inset 0 0 12px var(--accent); filter: brightness(1.3); }
        }
        .key-target {
            animation: keyPulse 1s infinite ease-in-out;
            border-color: var(--accent) !important;
            background: rgba(255, 255, 255, 0.15) !important;
            color: var(--accent) !important;
            font-weight: 800 !important;
        }

        #starfield {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .char-typed {
            color: #10b981;
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }
        .char-current {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.15);
            border-bottom: 3px solid var(--accent);
            animation: cursorBlink 0.8s infinite;
            border-radius: 2px;
            padding: 0 2px;
        }
        .char-wrong {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
            border-bottom: 3px solid #ef4444;
            animation: shake 0.25s ease-in-out;
        }

        .pinyin-segment {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 6px 14px 6px;
            padding: 6px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .pinyin-segment.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }
        .pinyin-segment.completed {
            background: rgba(16, 185, 129, 0.04);
            border-color: rgba(16, 185, 129, 0.3);
        }

        @keyframes cursorBlink {
            0%, 100% { border-color: var(--accent); }
            50% { border-color: transparent; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: rippleEffect 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center relative z-10 text-slate-100 p-4 select-none">

    <canvas id="starfield"></canvas>

    <!-- 欢迎开始面板 -->
    <div id="welcome-modal" class="fixed inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-md bg-slate-900/60 backdrop-blur-xl border border-purple-500/30 rounded-3xl p-8 neon-glow text-center relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-purple-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-pink-500/10 rounded-full blur-2xl"></div>
            
            <div class="text-6xl mb-4 animate-bounce">🎹</div>
            <h1 class="text-3xl font-bold bg-gradient-to-r from-pink-400 to-purple-400 bg-clip-text text-transparent mb-3">星光琴键</h1>
            <p class="text-sm text-purple-200/80 mb-6 leading-relaxed">
                欢迎来到充满魔力的钢琴森林！在这里你可以敲击键盘演奏经典旋律，不仅好玩，还能学会盲打与拼音输入哦！
            </p>
            <button id="btn-enter" class="w-full py-4 px-8 rounded-full bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 font-bold text-lg text-white hover:scale-105 transition-all duration-300 shadow-lg shadow-purple-500/20 hover:shadow-purple-500/40">
                ✨ 激活魔力，开启演奏 ✨
            </button>
        </div>
    </div>

    <!-- 成绩结算窗口 -->
    <div id="success-modal" class="fixed inset-0 bg-slate-950/85 z-40 hidden flex flex-col items-center justify-center p-4">
        <div class="max-w-lg w-full bg-slate-900/85 backdrop-blur-2xl border border-emerald-500/30 rounded-3xl p-8 neon-glow text-center relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-xl"></div>
            <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-xl"></div>

            <div class="text-5xl mb-3">🏆</div>
            <h2 class="text-2xl md:text-3xl font-bold text-emerald-400 mb-1">🎉 完美演奏完成！</h2>
            <p class="text-slate-400 text-sm mb-6">你弹奏的旋律连星星都在为你鼓掌！</p>

            <div class="grid grid-cols-2 gap-4 mb-6 text-left">
                <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800">
                    <p class="text-xs text-slate-400">平均打字速度</p>
                    <p class="text-2xl font-bold text-blue-400 jetbrains-font"><span id="report-wpm">0</span> <span class="text-xs">WPM</span></p>
                </div>
                <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800">
                    <p class="text-xs text-slate-400">准确率</p>
                    <p class="text-2xl font-bold text-emerald-400 jetbrains-font" id="report-acc">100%</p>
                </div>
                <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800">
                    <p class="text-xs text-slate-400">最大连击 (Combo)</p>
                    <p class="text-2xl font-bold text-pink-400 jetbrains-font" id="report-combo">0</p>
                </div>
                <div class="bg-slate-950/40 p-4 rounded-2xl border border-slate-800">
                    <p class="text-xs text-slate-400">获得称号</p>
                    <p class="text-base font-bold text-amber-400" id="report-title">见习小仙女</p>
                </div>
            </div>

            <div class="flex gap-4">
                <button id="btn-replay" class="flex-1 py-3 px-6 rounded-2xl bg-slate-800 hover:bg-slate-700 font-bold transition-all border border-slate-700">
                    🔄 重新弹奏
                </button>
                <button id="btn-next" class="flex-1 py-3 px-6 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 font-bold text-white transition-all shadow-lg">
                    下一首 🎵
                </button>
            </div>
        </div>
    </div>

    <header class="w-full max-w-6xl flex flex-wrap gap-4 justify-between items-center panel-glass p-4 rounded-2xl z-10">
        <!-- 标题 -->
        <div class="flex items-center gap-3">
            <span id="title-emoji" class="text-3xl transition-transform duration-500 hover:rotate-12 cursor-pointer">🌌</span>
            <div>
                <h1 class="text-lg font-bold bg-gradient-to-r from-pink-400 via-purple-400 to-blue-400 bg-clip-text text-transparent" id="main-title-text">星光琴键</h1>
                <p class="text-xs text-slate-300" id="subtitle-text">把指尖变为音符，在星空中飞舞</p>
            </div>
        </div>
        
        <!-- 主题、选曲与自动演奏 -->
        <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-300">主题:</span>
                <select id="theme-select" class="bg-slate-800/80 text-slate-200 text-xs font-semibold py-2 px-3 rounded-xl border border-slate-700 focus:outline-none cursor-pointer">
                    <option value="starlight">🌌 星空霓虹</option>
                    <option value="forest">🌲 童话森林</option>
                    <option value="ocean">🌊 梦幻海洋</option>
                    <option value="candy">🍬 甜蜜糖果</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <span class="text-xs text-slate-300">曲目:</span>
                <select id="song-select" class="bg-slate-800/80 text-slate-200 text-xs font-semibold py-2 px-3 rounded-xl border border-slate-700 focus:outline-none cursor-pointer max-w-[180px] md:max-w-xs">
                    <!-- JS动态填充 -->
                </select>
            </div>

            <!-- 自动演奏按钮 -->
            <button id="btn-autoplay" class="bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-slate-100 font-bold text-xs py-2 px-4 rounded-xl shadow-lg border border-purple-400/20 flex items-center gap-1 transition-all duration-300">
                <span id="auto-play-icon">🤖</span> <span id="auto-play-text">自动演奏</span>
            </button>
        </div>

        <!-- 实时数据面板 -->
        <div class="flex gap-6 text-sm jetbrains-font">
            <div class="text-center">
                <p class="text-xs text-slate-400">速度 WPM</p>
                <p id="stat-wpm" class="text-xl font-bold text-blue-400">0</p>
            </div>
            <div class="text-center">
                <p class="text-xs text-slate-400">准确率</p>
                <p id="stat-acc" class="text-xl font-bold text-emerald-400">100%</p>
            </div>
            <div class="text-center">
                <p class="text-xs text-slate-400">连击 Combo</p>
                <p id="stat-combo" class="text-xl font-bold text-pink-400 animate-pulse">0</p>
            </div>
        </div>
    </header>

    <main class="w-full max-w-5xl my-4 flex-1 flex flex-col justify-center items-center gap-4 z-10">
        <!-- 乐曲与进度 -->
        <div class="w-full flex items-center justify-between text-xs px-2 text-slate-400">
            <span id="display-author">作曲家：--</span>
            <span id="display-progress">进度：0%</span>
        </div>
        
        <div class="w-full bg-slate-900/60 h-2.5 rounded-full overflow-hidden border border-slate-800/80">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- 玻璃展示框 -->
        <div class="w-full panel-glass rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden flex flex-col min-h-[220px] justify-center">
            <div id="glow-1" class="absolute top-0 right-1/4 w-72 h-72 bg-blue-500/10 rounded-full blur-3xl transition-all duration-1000"></div>
            <div id="glow-2" class="absolute bottom-0 left-1/4 w-72 h-72 bg-pink-500/10 rounded-full blur-3xl transition-all duration-1000"></div>

            <!-- 打字文本层 (中文和英文自适应渲染) -->
            <div id="text-container" class="text-2xl md:text-3xl font-medium tracking-wide leading-relaxed text-slate-400 max-h-56 overflow-y-auto no-scrollbar select-none text-center relative z-10">
                <!-- JS动态加载 -->
            </div>
        </div>

        <div id="keyboard-tip" class="text-sm text-slate-300 italic flex items-center gap-2">
            ✨ 敲下高亮发光的琴键，美妙的钢琴声就会随你的指尖起舞哦...
        </div>
    </main>

    <footer class="w-full max-w-4xl z-10 panel-glass p-4 rounded-3xl mb-2">
        <div id="virtual-keyboard" class="flex flex-col gap-2 w-full jetbrains-font text-sm">
            <!-- JS自动生成QWERTY虚拟按键 -->
        </div>
    </footer>

    <script>
        // --- STREAMING_CHUNK: 初始化主题配色资源配置文件 ---
        const THEMES = {
            starlight: {
                primary: "#a855f7",
                secondary: "#ec4899",
                accent: "#3b82f6",
                bg: "radial-gradient(circle at center, #11092c 0%, #050212 100%)",
                panelBg: "rgba(15, 10, 36, 0.65)",
                keyBg: "rgba(15, 10, 36, 0.8)",
                keyBorder: "rgba(168, 85, 247, 0.2)",
                shadow: "0 0 25px rgba(168, 85, 247, 0.6)",
                textHighlight: "#a855f7",
                particleColors: ["#a855f7", "#ec4899", "#3b82f6", "#f43f5e"],
                particleShape: "star",
                emoji: "🌌",
                sub: "把指尖变为音符，在星空中飞舞"
            },
            forest: {
                primary: "#10b981",
                secondary: "#f59e0b",
                accent: "#10b981",
                bg: "radial-gradient(circle at center, #062f1c 0%, #020f08 100%)",
                panelBg: "rgba(4, 25, 15, 0.7)",
                keyBg: "rgba(4, 25, 15, 0.85)",
                keyBorder: "rgba(16, 185, 129, 0.2)",
                shadow: "0 0 25px rgba(16, 185, 129, 0.6)",
                textHighlight: "#10b981",
                particleColors: ["#10b981", "#84cc16", "#eab308", "#34d399"],
                particleShape: "leaf",
                emoji: "🌲",
                sub: "踏入童话精灵之林，演奏大自然的古典旋律"
            },
            ocean: {
                primary: "#06b6d4",
                secondary: "#3b82f6",
                accent: "#06b6d4",
                bg: "radial-gradient(circle at center, #052a4a 0%, #010d1a 100%)",
                panelBg: "rgba(3, 23, 41, 0.7)",
                keyBg: "rgba(3, 23, 41, 0.85)",
                keyBorder: "rgba(6, 182, 212, 0.2)",
                shadow: "0 0 25px rgba(6, 182, 212, 0.6)",
                textHighlight: "#06b6d4",
                particleColors: ["#06b6d4", "#3b82f6", "#22d3ee", "#60a5fa"],
                particleShape: "bubble",
                emoji: "🌊",
                sub: "深海中的梦幻气泡，随美妙的琴声飘散"
            },
            candy: {
                primary: "#f43f5e",
                secondary: "#ec4899",
                accent: "#ff80b5",
                bg: "radial-gradient(circle at center, #420f26 0%, #17030b 100%)",
                panelBg: "rgba(38, 7, 21, 0.7)",
                keyBg: "rgba(38, 7, 21, 0.85)",
                keyBorder: "rgba(244, 63, 94, 0.2)",
                shadow: "0 0 25px rgba(244, 63, 94, 0.6)",
                textHighlight: "#f43f5e",
                particleColors: ["#f43f5e", "#ec4899", "#fbbf24", "#fda4af"],
                particleShape: "candy",
                emoji: "🍬",
                sub: "甜蜜软糖与粉色城堡，敲击出香甜梦幻的味道"
            }
        };

        let currentTheme = "starlight";

        // 主题动态转换引擎
        function changeTheme(themeKey) {
            currentTheme = themeKey;
            const theme = THEMES[themeKey];
            
            document.documentElement.style.setProperty('--primary', theme.primary);
            document.documentElement.style.setProperty('--secondary', theme.secondary);
            document.documentElement.style.setProperty('--accent', theme.accent);
            document.documentElement.style.setProperty('--bg-gradient', theme.bg);
            document.documentElement.style.setProperty('--panel-bg', theme.panelBg);
            document.documentElement.style.setProperty('--key-bg', theme.keyBg);
            document.documentElement.style.setProperty('--key-border', theme.keyBorder);
            document.documentElement.style.setProperty('--shadow-glow', theme.shadow);
            document.documentElement.style.setProperty('--text-highlight', theme.textHighlight);
            
            document.getElementById('title-emoji').innerText = theme.emoji;
            document.getElementById('subtitle-text').innerText = theme.sub;

            document.getElementById('glow-1').style.backgroundColor = theme.primary + "1D";
            document.getElementById('glow-2').style.backgroundColor = theme.secondary + "1D";

            highlightNextKeyOnKeyboard();
        }

        // --- STREAMING_CHUNK: 编写环境粒子渲染动画系统 ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GameParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1.5;
                this.speedX = Math.random() * 0.25 - 0.125;
                this.speedY = Math.random() * 0.25 - 0.125;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.02 - 0.01;
                
                const themeColors = THEMES[currentTheme].particleColors;
                this.color = themeColors[Math.floor(Math.random() * themeColors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.spin;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;

                const shape = THEMES[currentTheme].particleShape;
                if (shape === "star") {
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        ctx.lineTo(0, -this.size * 2);
                        ctx.rotate(Math.PI / 4);
                        ctx.lineTo(0, -this.size * 0.5);
                        ctx.rotate(Math.PI / 4);
                    }
                    ctx.closePath();
                    ctx.fill();
                } else if (shape === "leaf") {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 2, this.size, 0, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fill();
                } else if (shape === "bubble") {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = "#ffffff";
                    ctx.globalAlpha = this.opacity * 0.4;
                    ctx.beginPath();
                    ctx.arc(-this.size * 0.6, -this.size * 0.6, this.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (shape === "candy") {
                    ctx.beginPath();
                    const d = this.size * 1.8;
                    ctx.moveTo(0, d / 4);
                    ctx.quadraticCurveTo(0, 0, d / 4, 0);
                    ctx.quadraticCurveTo(d / 2, 0, d / 2, d / 4);
                    ctx.quadraticCurveTo(d / 2, d / 2, 0, d * 0.85);
                    ctx.quadraticCurveTo(-d / 2, d / 2, -d / 2, d / 4);
                    ctx.quadraticCurveTo(-d / 2, 0, -d / 4, 0);
                    ctx.quadraticCurveTo(0, 0, 0, d / 4);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < 80; i++) {
            particles.push(new GameParticle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- STREAMING_CHUNK: 编写钢琴谐波包络声效引擎 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playPianoTone(freq, duration = 1.3) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // 基准弦音
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);

            // 一次谐波
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq * 2, now);

            // 金属共振饱和
            const osc3 = audioCtx.createOscillator();
            osc3.type = 'triangle';
            osc3.frequency.setValueAtTime(freq * 3, now);

            const mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0, now);
            mainGain.gain.linearRampToValueAtTime(0.4, now + 0.005);
            mainGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            overtoneGain.gain.setValueAtTime(0.12, now);

            metallicGain.gain.setValueAtTime(0.05, now);

            osc2.connect(overtoneGain);
            overtoneGain.connect(mainGain);
            osc3.connect(metallicGain);
            metallicGain.connect(mainGain);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, now);
            filter.frequency.exponentialRampToValueAtTime(320, now + duration);

            osc1.stop(now + duration);
            osc2.start(now);
            osc2.stop(now + duration);
            osc3.start(now);
            osc3.stop(now + duration);
        }

            filter.connect(audioCtx.destination);

                    return;

                nextChar = song.text[typedTextLength].toLowerCase();

            const virtualKeyEl = document.getElementById(`key-${pressedKey.toLowerCase()}`);
            if (virtualKeyEl) {
                virtualKeyEl.classList.add('key-active');
                createRippleEffect(virtualKeyEl);
                setTimeout(() => virtualKeyEl.classList.remove('key-active'), 120);
            }

            if (song.isPinyin) {
                const activeSegment = song.segments[currentSegmentIndex];
                const expectedChar = activeSegment.p[currentPinyinCharIndex];

                if (pressedKey.toLowerCase() === expectedChar.toLowerCase()) {
                    isCorrect = true;
                    currentPinyinCharIndex++;

                    if (currentPinyinCharIndex >= activeSegment.p.length) {
                        currentSegmentIndex++;
                        currentPinyinCharIndex = 0;
                    }

                    if (currentSegmentIndex >= song.segments.length) {
                        clearInterval(typingTimer);
                        congratulateFinished();
                    }
                }
            } else {
                const expectedChar = song.text[typedTextLength];
                
                if (pressedKey.toLowerCase() === expectedChar.toLowerCase()) {
                    isCorrect = true;
                    typedTextLength++;

                    if (typedTextLength >= song.text.length) {
                        clearInterval(typingTimer);
                        congratulateFinished();
                    }
                }
            }

            if (isCorrect) {
                const melodyNote = song.melody[correctCount % song.melody.length];
                const freq = NOTES[melodyNote] || 261.63;
                playPianoTone(freq);

                correctCount++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;

                renderTextDisplay();
                highlightNextKeyOnKeyboard();
            } else {
                playDampTone();
                errors++;
                combo = 0;

                if (song.isPinyin) {
                    const segs = textContainer.getElementsByClassName('pinyin-segment');
                    const curSeg = segs[currentSegmentIndex];
                    if (curSeg) {
                        curSeg.classList.add('char-wrong');
                        setTimeout(() => curSeg.classList.remove('char-wrong'), 250);
                    }
                } else {
                    const spans = textContainer.getElementsByTagName('span');
                    const curSpan = spans[typedTextLength];
                    if (curSpan) {
                        curSpan.classList.add('char-wrong');
                        setTimeout(() => curSpan.classList.remove('char-wrong'), 250);
                    }
                }
            }

            updateStatsUI();
        });

        function updateStatsUI() {
            statCombo.innerText = combo;

            const accuracy = keystrokes > 0 ? Math.round(((keystrokes - errors) / keystrokes) * 100) : 100;
            statAcc.innerText = `${accuracy}%`;

            let wpm = 0;
            if (startTime) {
                const elapsedMin = (new Date() - startTime) / 1000 / 60;
                if (elapsedMin > 0) {
                    const letterTypedCount = SONGS[currentSongIndex].isPinyin 
                        ? getPinyinTypedLettersCount()
                        : typedTextLength;
                    wpm = Math.round((letterTypedCount / 5) / elapsedMin);
                }
            }
            statWpm.innerText = wpm;
        }

        function getPinyinTypedLettersCount() {
            const song = SONGS[currentSongIndex];
            let count = 0;
            for (let i = 0; i < currentSegmentIndex; i++) {
                count += song.segments[i].p.length;
            }
            count += currentPinyinCharIndex;
            return count;
        }

        // --- STREAMING_CHUNK: 编写结算勋章荣誉算法 ---
        function congratulateFinished() {
            setTimeout(() => {
                const accuracy = Math.round(((keystrokes - errors) / keystrokes) * 100);
                
                let wpm = 0;
                if (startTime) {
                    const elapsedMin = (new Date() - startTime) / 1000 / 60;
                    const letterTypedCount = SONGS[currentSongIndex].isPinyin 
                        ? getPinyinTypedLettersCount()
                        : typedTextLength;
                    wpm = Math.round((letterTypedCount / 5) / elapsedMin);
                }

                let rankTitle = "见习音乐仙女 ✨";
                if (accuracy >= 96 && wpm >= 42) rankTitle = "星光至尊琴魔 👑";
                else if (accuracy >= 92 && wpm >= 28) rankTitle = "精灵大琴师 🦄";
                else if (accuracy >= 80) rankTitle = "星空吟游乐徒 🎵";

                document.getElementById('report-wpm').innerText = wpm;
                document.getElementById('report-acc').innerText = `${accuracy}%`;
                document.getElementById('report-combo').innerText = maxCombo;
                document.getElementById('report-title').innerText = rankTitle;

                successModal.style.display = "flex";
            }, 600);
        }

        // 绑定各种面板控制点击事件
        btnEnter.addEventListener('click', () => {
            initAudio();
            welcomeModal.style.display = 'none';
            loadSong(0); 
        });

        btnReplay.addEventListener('click', () => {
            successModal.style.display = "none";
            loadSong(currentSongIndex);
        });

        btnNext.addEventListener('click', () => {
            successModal.style.display = "none";
            let nextIndex = (currentSongIndex + 1) % SONGS.length;
            songSelect.value = nextIndex;
            loadSong(nextIndex);
        });

        songSelect.addEventListener('change', (e) => {
            loadSong(parseInt(e.target.value));
        });

        themeSelect.addEventListener('change', (e) => {
            changeTheme(e.target.value);
        });

        btnAutoplay.addEventListener('click', () => {
            toggleAutoPlay();
        });

        // 初始化默认星空主题
        changeTheme("starlight");
    </script>
</body>
</html>
