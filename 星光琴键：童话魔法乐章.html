    <style>
        :root {
            --primary: #a855f7;
            --secondary: #ec4899;
            --accent: #3b82f6;
            --bg-gradient: radial-gradient(circle at center, #11092c 0%, #050212 100%);
            --panel-bg: rgba(15, 10, 36, 0.65);
            --key-bg: rgba(15, 10, 36, 0.8);
            --key-border: rgba(168, 85, 247, 0.2);
            --shadow-glow: 0 0 20px rgba(168, 85, 247, 0.6);
            --text-highlight: #a855f7;
        }

        body {
            font-family: 'Comfortaa', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
            background: var(--bg-gradient);
            overflow-x: hidden;
            overscroll-behavior: none;
            transition: background 0.8s ease, color 0.3s ease;
        }
        
        .jetbrains-font {
            font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
        }

        .neon-glow {
            box-shadow: var(--shadow-glow);
            transition: box-shadow 0.5s ease;
        }

        .panel-glass {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            transition: background 0.8s ease, border-color 0.8s ease;
        }

        .key-glass {
            background: var(--key-bg);
            border: 1px solid var(--key-border);
            transition: all 0.1s ease, background 0.8s ease, border-color 0.8s ease;
        }

        /* 隐藏滚动条 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 琴键激活特效 */
        .key-active {
            transform: scale(0.9) translateY(3px) !important;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%) !important;
            box-shadow: 0 0 20px var(--secondary) !important;
            border-color: transparent !important;
            color: #ffffff !important;
        }

        /* 呼吸等待按键特效 */
        @keyframes keyPulse {
            0%, 100% { box-shadow: 0 0 5px var(--accent), inset 0 0 5px var(--accent); filter: brightness(1); }
            50% { box-shadow: 0 0 22px var(--accent), inset 0 0 12px var(--accent); filter: brightness(1.3); }
        }
        .key-target {
            animation: keyPulse 1s infinite ease-in-out;
            border-color: var(--accent) !important;
            background: rgba(255, 255, 255, 0.15) !important;
            color: var(--accent) !important;
            font-weight: 800 !important;
        }

        #starfield {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .char-typed {
            color: #10b981;
            text-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }
        .char-current {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.15);
            border-bottom: 3px solid var(--accent);
            animation: cursorBlink 0.8s infinite;
            border-radius: 2px;
            padding: 0 2px;
        }
        .char-wrong {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
            border-bottom: 3px solid #ef4444;
            animation: shake 0.25s ease-in-out;
        }

        .pinyin-segment {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 0 6px 14px 6px;
            padding: 6px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .pinyin-segment.active {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            transform: scale(1.05);
        }
        .pinyin-segment.completed {
            background: rgba(16, 185, 129, 0.04);
            border-color: rgba(16, 185, 129, 0.3);
        }

        @keyframes cursorBlink {
            0%, 100% { border-color: var(--accent); }
            50% { border-color: transparent; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0);
            animation: rippleEffect 0.6s cubic-bezier(0.1, 0.8, 0.3, 1);
            pointer-events: none;
        }
        @keyframes rippleEffect {
            to { transform: scale(4); opacity: 0; }
        }

        /* ---------- 移动端 / 触屏适配 ---------- */
        /* 屏幕上的琴键本身就是按钮，触屏必须能直接敲 */
        .key-glass {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
            user-select: none;
        }
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        @media (max-width: 820px), (max-height: 500px) and (max-width: 1000px) {
            body.min-h-screen {
                height: 100vh;
                height: 100dvh;
                min-height: 0 !important;
                padding: 8px;
                overflow: hidden;
                justify-content: flex-start !important;
            }

            /* 欢迎 / 结算面板：小屏可滚动，不再被裁掉 */
            #welcome-modal,
            #success-modal {
                padding: 14px !important;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            #welcome-modal > div,
            #success-modal > div {
                padding: 20px 16px !important;
                max-height: none;
            }
            #welcome-modal button#btn-enter {
                padding: 12px 16px !important;
                font-size: 15px !important;
                line-height: 1.5;
            }
            #success-modal .grid { gap: 10px; }
            #success-modal .flex.gap-4 { gap: 10px; }

            /* 顶栏压成两行：标题 + 数据 / 主题&选曲&自动演奏 */
            #game-header {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 6px 10px;
                padding: 8px 10px !important;
                align-items: center;
            }
            #game-header > div:nth-child(1) { grid-column: 1; grid-row: 1; min-width: 0; gap: 6px !important; }
            #game-header > div:nth-child(2) {
                grid-column: 1 / -1;
                grid-row: 2;
                display: flex;
                flex-wrap: nowrap;
                overflow-x: auto;
                gap: 6px !important;
                padding-bottom: 2px;
                scrollbar-width: none;
            }
            #game-header > div:nth-child(2)::-webkit-scrollbar { display: none; }
            #game-header > div:nth-child(2) > div {
                flex: 1 1 0;
                min-width: 0;
                gap: 0 !important;
            }
            /* 主题 / 曲目 的文字标签在手机上省略，下拉框本身已经说明了内容 */
            #game-header > div:nth-child(2) > div > span:first-child { display: none; }
            #theme-select, #song-select { width: 100%; max-width: none; font-size: 16px; padding: 5px 6px; }
            #btn-autoplay { padding: 7px 8px; }
            #game-header > div:nth-child(3) {
                grid-column: 2;
                grid-row: 1;
                gap: 10px !important;
                justify-content: flex-end;
            }
            #title-emoji { font-size: 22px !important; }
            #main-title-text { font-size: 16px !important; }
            #subtitle-text { display: none; }
            #game-header > div:nth-child(3) p:first-child { font-size: 9px; letter-spacing: 0; }
            #stat-wpm, #stat-acc, #stat-combo { font-size: 15px !important; line-height: 1.2; }

            /* 中间区域自适应，文字框自己滚动 */
            #game-main {
                margin: 6px 0 !important;
                gap: 6px !important;
                flex: 1 1 auto;
                min-height: 0;
                justify-content: center;
            }
            #game-main > .panel-glass {
                flex: 0 1 auto;
                min-height: 0;
                max-height: 100%;
                padding: 10px;
            }
            #text-container {
                max-height: none !important;
                flex: 1 1 auto;
                min-height: 0;
                height: auto;
                overflow-y: auto;
                font-size: 20px;
                line-height: 1.55;
            }
            .pinyin-segment { margin: 0 3px 8px; padding: 4px 6px; }
            .pinyin-segment > div:first-child { font-size: 17px !important; }

    <script>
        // --- STREAMING_CHUNK: 初始化主题配色资源配置文件 ---
        const THEMES = {
            starlight: {
                primary: "#a855f7",
                secondary: "#ec4899",
                accent: "#3b82f6",
                bg: "radial-gradient(circle at center, #11092c 0%, #050212 100%)",

                shadow: "0 0 25px rgba(168, 85, 247, 0.6)",

                particleShape: "star",
                emoji: "🌌",
                sub: "把指尖变为音符，在星空中飞舞"
            },
            forest: {
                primary: "#10b981",
                secondary: "#f59e0b",
                accent: "#10b981",
                bg: "radial-gradient(circle at center, #062f1c 0%, #020f08 100%)",
                panelBg: "rgba(4, 25, 15, 0.7)",
                keyBg: "rgba(4, 25, 15, 0.85)",
                keyBorder: "rgba(16, 185, 129, 0.2)",
                shadow: "0 0 25px rgba(16, 185, 129, 0.6)",
                textHighlight: "#10b981",
                particleColors: ["#10b981", "#84cc16", "#eab308", "#34d399"],
                particleShape: "leaf",
                emoji: "🌲",
                sub: "踏入童话精灵之林，演奏大自然的古典旋律"
            },
            ocean: {
                primary: "#06b6d4",
                secondary: "#3b82f6",
                accent: "#06b6d4",
                bg: "radial-gradient(circle at center, #052a4a 0%, #010d1a 100%)",
                panelBg: "rgba(3, 23, 41, 0.7)",
                keyBg: "rgba(3, 23, 41, 0.85)",
                keyBorder: "rgba(6, 182, 212, 0.2)",
                shadow: "0 0 25px rgba(6, 182, 212, 0.6)",
                textHighlight: "#06b6d4",
                particleColors: ["#06b6d4", "#3b82f6", "#22d3ee", "#60a5fa"],
                particleShape: "bubble",
                emoji: "🌊",
                sub: "深海中的梦幻气泡，随美妙的琴声飘散"
            },
            candy: {
                primary: "#f43f5e",
                secondary: "#ec4899",
                accent: "#ff80b5",
                bg: "radial-gradient(circle at center, #420f26 0%, #17030b 100%)",
                panelBg: "rgba(38, 7, 21, 0.7)",
                keyBg: "rgba(38, 7, 21, 0.85)",
                keyBorder: "rgba(244, 63, 94, 0.2)",
                shadow: "0 0 25px rgba(244, 63, 94, 0.6)",
                textHighlight: "#f43f5e",
                particleColors: ["#f43f5e", "#ec4899", "#fbbf24", "#fda4af"],
                particleShape: "candy",
                emoji: "🍬",
                sub: "甜蜜软糖与粉色城堡，敲击出香甜梦幻的味道"
            }
        };

        let currentTheme = "starlight";

        // 主题动态转换引擎
        function changeTheme(themeKey) {
            currentTheme = themeKey;
            const theme = THEMES[themeKey];
            
            document.documentElement.style.setProperty('--primary', theme.primary);
            document.documentElement.style.setProperty('--secondary', theme.secondary);
            document.documentElement.style.setProperty('--accent', theme.accent);
            document.documentElement.style.setProperty('--bg-gradient', theme.bg);
            document.documentElement.style.setProperty('--panel-bg', theme.panelBg);
            document.documentElement.style.setProperty('--key-bg', theme.keyBg);
            document.documentElement.style.setProperty('--key-border', theme.keyBorder);
            document.documentElement.style.setProperty('--shadow-glow', theme.shadow);
            document.documentElement.style.setProperty('--text-highlight', theme.textHighlight);
            
            document.getElementById('title-emoji').innerText = theme.emoji;
            document.getElementById('subtitle-text').innerText = theme.sub;

            document.getElementById('glow-1').style.backgroundColor = theme.primary + "1D";
            document.getElementById('glow-2').style.backgroundColor = theme.secondary + "1D";

            highlightNextKeyOnKeyboard();
        }

        // --- STREAMING_CHUNK: 编写环境粒子渲染动画系统 ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class GameParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1.5;
                this.speedX = Math.random() * 0.25 - 0.125;
                this.speedY = Math.random() * 0.25 - 0.125;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.02 - 0.01;
                
                const themeColors = THEMES[currentTheme].particleColors;
                this.color = themeColors[Math.floor(Math.random() * themeColors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.spin;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;

                const shape = THEMES[currentTheme].particleShape;
                if (shape === "star") {
                    ctx.beginPath();
                    for (let i = 0; i < 4; i++) {
                        ctx.lineTo(0, -this.size * 2);
                        ctx.rotate(Math.PI / 4);
                        ctx.lineTo(0, -this.size * 0.5);
                        ctx.rotate(Math.PI / 4);
                    }
                    ctx.closePath();
                    ctx.fill();
                } else if (shape === "leaf") {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size * 2, this.size, 0, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.fill();
                } else if (shape === "bubble") {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = "#ffffff";
                    ctx.globalAlpha = this.opacity * 0.4;
                    ctx.beginPath();
                    ctx.arc(-this.size * 0.6, -this.size * 0.6, this.size * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (shape === "candy") {
                    ctx.beginPath();
                    const d = this.size * 1.8;
                    ctx.moveTo(0, d / 4);
                    ctx.quadraticCurveTo(0, 0, d / 4, 0);
                    ctx.quadraticCurveTo(d / 2, 0, d / 2, d / 4);
                    ctx.quadraticCurveTo(d / 2, d / 2, 0, d * 0.85);
                    ctx.quadraticCurveTo(-d / 2, d / 2, -d / 2, d / 4);
                    ctx.quadraticCurveTo(-d / 2, 0, -d / 4, 0);
                    ctx.quadraticCurveTo(0, 0, 0, d / 4);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < 80; i++) {
            particles.push(new GameParticle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- STREAMING_CHUNK: 编写钢琴谐波包络声效引擎 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                audioCtx = new AC();
            }
            // iOS / 移动端：AudioContext 可能处于 suspended 状态，需要用户手势里恢复
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
            }
        }

        function playPianoTone(freq, duration = 1.3) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // 基准弦音
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sine';
            osc1.frequency.setValueAtTime(freq, now);

            // 一次谐波
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(freq * 2, now);

            // 金属共振饱和
            const osc3 = audioCtx.createOscillator();
            osc3.type = 'triangle';
            osc3.frequency.setValueAtTime(freq * 3, now);

            const mainGain = audioCtx.createGain();
            mainGain.gain.setValueAtTime(0, now);
            mainGain.gain.linearRampToValueAtTime(0.4, now + 0.005);
            mainGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            const overtoneGain = audioCtx.createGain();
            overtoneGain.gain.setValueAtTime(0.12, now);

            const metallicGain = audioCtx.createGain();
            metallicGain.gain.setValueAtTime(0.05, now);

            osc1.connect(mainGain);
            osc2.connect(overtoneGain);
            overtoneGain.connect(mainGain);
            osc3.connect(metallicGain);
            metallicGain.connect(mainGain);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1400, now);
            filter.frequency.exponentialRampToValueAtTime(320, now + duration);

            mainGain.connect(filter);
            filter.connect(audioCtx.destination);

            osc1.start(now);
            osc1.stop(now + duration);
            osc2.start(now);
            osc2.stop(now + duration);
            osc3.start(now);
            osc3.stop(now + duration);
        }

        function playDampTone() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(85, now);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(130, now);

            osc.connect(gain);
            gain.connect(filter);
            filter.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.15);
        }

        // --- STREAMING_CHUNK: 编写键盘物理排版映射表 ---

        ];

        /** 字符 -> 屏幕琴键 id（空格用 key-space） */
        function keyIdFor(ch) {
            if (!ch) return '';
            if (ch === ' ') return 'key-space';
            return `key-${ch.toLowerCase()}`;
        }

        // --- STREAMING_CHUNK: 初始化核心打字逻辑状态器 ---

        // 生成QWERTY屏幕键盘（触屏可直接点击演奏）

            virtualKeyboard.innerHTML = "";

                const rowDiv = document.createElement('div');
                rowDiv.className = "flex justify-center gap-1 md:gap-2 w-full";
                row.forEach(key => {
                    const isSpace = key === "SPACE";
                    const keyDiv = document.createElement('div');
                    keyDiv.id = isSpace ? "key-space" : `key-${key.toLowerCase()}`;
                    keyDiv.innerText = isSpace ? "空格" : key;
                    keyDiv.dataset.key = isSpace ? " " : key.toLowerCase();
                    keyDiv.setAttribute('role', 'button');
                    keyDiv.setAttribute('aria-label', isSpace ? "空格键" : `琴键 ${key}`);
                    keyDiv.className = "key-glass flex-1 max-w-[70px] h-10 md:h-12 rounded-xl flex items-center justify-center font-bold text-slate-300 shadow-md relative overflow-hidden" + (isSpace ? " text-xs" : "");

                        keyDiv.style.flex = "4 1 0%";
                        keyDiv.style.maxWidth = "300px";
                    }
                    // 触屏 / 鼠标：按下即弹奏（pointerdown 比 click 更跟手）
                    keyDiv.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        handleTypedKey(keyDiv.dataset.key);
                    });
                    rowDiv.appendChild(keyDiv);
                });
                virtualKeyboard.appendChild(rowDiv);
            });

        // --- STREAMING_CHUNK: 编写打字曲目数据重置载入引擎 ---

            const song = SONGS[index];

            updateStatsUI();
            renderTextDisplay();
            highlightNextKeyOnKeyboard();

        // 渲染文本和拼音排版
        function renderTextDisplay() {
            textContainer.innerHTML = "";
            const song = SONGS[currentSongIndex];

            if (song.isPinyin) {
                // 中文拼音拼卡模式
                song.segments.forEach((seg, sIdx) => {
                    const segSpan = document.createElement('div');
                    segSpan.className = "pinyin-segment";
                    
                    const charDiv = document.createElement('div');
                    charDiv.innerText = seg.c;
                    charDiv.className = "text-xl md:text-2xl font-bold transition-all duration-200";

                    const pinyinDiv = document.createElement('div');
                    pinyinDiv.className = "text-xs jetbrains-font tracking-tighter text-slate-400 mt-1 uppercase";
                    
                    for (let charI = 0; charI < seg.p.length; charI++) {
                        const letterSpan = document.createElement('span');
                        letterSpan.innerText = seg.p[charI];
                        
                        if (sIdx < currentSegmentIndex) {
                            letterSpan.className = "text-emerald-400 font-bold";
                        } else if (sIdx === currentSegmentIndex) {
                            if (charI < currentPinyinCharIndex) {
                                letterSpan.className = "text-emerald-400 font-bold";
                            } else if (charI === currentPinyinCharIndex) {
                                letterSpan.className = "text-blue-400 font-bold border-b-2 border-blue-400 animate-pulse";
                            }
                        }
                        pinyinDiv.appendChild(letterSpan);
                    }

                    if (sIdx < currentSegmentIndex) {
                        segSpan.classList.add('completed');
                        charDiv.className = "text-emerald-400 font-bold drop-shadow-[0_0_5px_rgba(16,185,129,0.4)]";
                    } else if (sIdx === currentSegmentIndex) {
                        segSpan.classList.add('active');
                        charDiv.style.color = "var(--primary)";
                        charDiv.classList.add("scale-105", "font-extrabold");
                    } else {
                        charDiv.className = "text-slate-600";
                    }

                    segSpan.appendChild(charDiv);
                    segSpan.appendChild(pinyinDiv);
                    textContainer.appendChild(segSpan);
                });

                const progressPercent = Math.round((currentSegmentIndex / song.segments.length) * 100);
                displayProgress.innerText = `进度：${progressPercent}%`;
                progressBar.style.width = `${progressPercent}%`;

                const curEl = textContainer.querySelector('.active');
                if (curEl) {
                    textContainer.scrollTop = curEl.offsetTop - textContainer.clientHeight / 2 + 15;
                }

            } else {
                // 英文滚屏模式
                const text = song.text;
                for (let i = 0; i < text.length; i++) {
                    const span = document.createElement('span');
                    span.innerText = text[i];
                    if (i < typedTextLength) {
                        span.className = "char-typed";
                    } else if (i === typedTextLength) {
                        span.className = "char-current";
                    } else {
                        span.className = "text-slate-600";
                    }
                    textContainer.appendChild(span);
                }

                const curEl = textContainer.querySelector('.char-current');
                if (curEl) {
                    textContainer.scrollTop = curEl.offsetTop - textContainer.clientHeight / 2 + 15;
                }

                const progressPercent = Math.round((typedTextLength / text.length) * 100);
                displayProgress.innerText = `进度：${progressPercent}%`;
                progressBar.style.width = `${progressPercent}%`;
            }
        }

        // --- STREAMING_CHUNK: 编写屏幕键盘发光指向标记定位功能 ---
        function highlightNextKeyOnKeyboard() {
            document.querySelectorAll('.key-target').forEach(el => el.classList.remove('key-target'));
            
            const song = SONGS[currentSongIndex];
            let nextChar = "";

            if (song.isPinyin) {
                if (currentSegmentIndex >= song.segments.length) return; 
                const seg = song.segments[currentSegmentIndex];
                nextChar = seg.p[currentPinyinCharIndex];
            } else {
                if (typedTextLength >= song.text.length) return; 
                nextChar = song.text[typedTextLength].toLowerCase();
            }

            if (!nextChar) return;

            const keyEl = document.getElementById(keyIdFor(nextChar));
            if (keyEl) {
                keyEl.classList.add('key-target');
            }
        }

        function createRippleEffect(element) {
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            element.appendChild(ripple);
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // --- STREAMING_CHUNK: 编写自动演奏模拟点击触发机理 ---
        function toggleAutoPlay() {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            initAudio();
            isAutoPlaying = true;
            btnAutoplay.classList.remove('from-indigo-500', 'to-purple-500');
            btnAutoplay.classList.add('from-red-500', 'to-orange-500');
            document.getElementById('auto-play-text').innerText = "停止演奏";
            document.getElementById('auto-play-icon').innerText = "⏹️";

            if (!startTime) {
                startTime = new Date();
                typingTimer = setInterval(updateStatsUI, 1000);
            }

            // 智能自动输入定时器：每 240ms 弹奏一个按键
            autoPlayIntervalId = setInterval(() => {
                simulateNextKeypress();
            }, 240);
        }

        function stopAutoPlay() {
            isAutoPlaying = false;
            if (autoPlayIntervalId) {
                clearInterval(autoPlayIntervalId);
                autoPlayIntervalId = null;
            }
            btnAutoplay.classList.remove('from-red-500', 'to-orange-500');
            btnAutoplay.classList.add('from-indigo-500', 'to-purple-500');
            document.getElementById('auto-play-text').innerText = "自动演奏";
            document.getElementById('auto-play-icon').innerText = "🤖";
        }

        // 模拟按键事件发生器
        function simulateNextKeypress() {
            const song = SONGS[currentSongIndex];
            let nextChar = "";

            if (song.isPinyin) {
                if (currentSegmentIndex >= song.segments.length) {
                    stopAutoPlay();
                    return;
                }
                const seg = song.segments[currentSegmentIndex];
                nextChar = seg.p[currentPinyinCharIndex];
            } else {
                if (typedTextLength >= song.text.length) {
                    stopAutoPlay();
                    return;
                }
                nextChar = song.text[typedTextLength].toLowerCase();
            }

            if (!nextChar) return;

            keystrokes++;

            // 触发虚拟键盘发光动画
            const virtualKeyEl = document.getElementById(keyIdFor(nextChar));
            if (virtualKeyEl) {
                virtualKeyEl.classList.add('key-active');
                createRippleEffect(virtualKeyEl);
                setTimeout(() => virtualKeyEl.classList.remove('key-active'), 120);
            }

            // 执行正确的模拟逻辑
            if (song.isPinyin) {
                const activeSegment = song.segments[currentSegmentIndex];
                currentPinyinCharIndex++;
                if (currentPinyinCharIndex >= activeSegment.p.length) {
                    currentSegmentIndex++;
                    currentPinyinCharIndex = 0;
                }
                if (currentSegmentIndex >= song.segments.length) {
                    stopAutoPlay();
                    clearInterval(typingTimer);
                    congratulateFinished();
                }
            } else {
                typedTextLength++;
                if (typedTextLength >= song.text.length) {
                    stopAutoPlay();
                    clearInterval(typingTimer);
                    congratulateFinished();
                }
            }

            // 完美输出钢琴正音
            const melodyNote = song.melody[correctCount % song.melody.length];
            const freq = NOTES[melodyNote] || 261.63;
            playPianoTone(freq);

            correctCount++;
            combo++;
            if (combo > maxCombo) maxCombo = combo;

            renderTextDisplay();
            highlightNextKeyOnKeyboard();
            updateStatsUI();
        }

        // --- STREAMING_CHUNK: 编写物理键盘主输入处理器与自锁过滤器 ---
        window.addEventListener('keydown', (e) => {
            if (welcomeModal.style.display !== 'none' || successModal.style.display === 'flex') return;

            // 如果正在自动演奏，阻断玩家键盘物理输入
            if (isAutoPlaying) {
                e.preventDefault();
                return;
            }

            if (e.key === 'Tab' || e.key === 'Backspace' || e.key === 'Enter') {
                e.preventDefault();
                return;
            }

            const pressedKey = e.key;
            if (pressedKey.length !== 1) return;
            // 组合键（Ctrl+C 等）不算演奏
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            // 空格键默认会滚动页面，'/' 会触发快速查找，一并拦掉
            e.preventDefault();
            handleTypedKey(pressedKey);
        });

        /**
         * 统一的按键处理器：物理键盘与屏幕琴键（触屏）共用
         */
        function handleTypedKey(pressedKey) {
            if (welcomeModal.style.display !== 'none' || successModal.style.display === 'flex') return;
            if (isAutoPlaying) return;
            if (typeof pressedKey !== 'string' || pressedKey.length !== 1) return;

            if (!startTime) {
                startTime = new Date();
                typingTimer = setInterval(updateStatsUI, 1000);
            }

            keystrokes++;
            const song = SONGS[currentSongIndex];
            let isCorrect = false;

            const virtualKeyEl = document.getElementById(keyIdFor(pressedKey));
            if (virtualKeyEl) {
                virtualKeyEl.classList.add('key-active');
                createRippleEffect(virtualKeyEl);
                setTimeout(() => virtualKeyEl.classList.remove('key-active'), 120);
            }

            if (song.isPinyin) {
                const activeSegment = song.segments[currentSegmentIndex];
                const expectedChar = activeSegment.p[currentPinyinCharIndex];

                if (pressedKey.toLowerCase() === expectedChar.toLowerCase()) {
                    isCorrect = true;
                    currentPinyinCharIndex++;

                    if (currentPinyinCharIndex >= activeSegment.p.length) {
                        currentSegmentIndex++;
                        currentPinyinCharIndex = 0;
                    }

                    if (currentSegmentIndex >= song.segments.length) {
                        clearInterval(typingTimer);
                        congratulateFinished();
                    }
                }
            } else {
                const expectedChar = song.text[typedTextLength];
                
                if (pressedKey.toLowerCase() === expectedChar.toLowerCase()) {
                    isCorrect = true;
                    typedTextLength++;

                    if (typedTextLength >= song.text.length) {
                        clearInterval(typingTimer);
                        congratulateFinished();
                    }
                }
            }

            if (isCorrect) {
                const melodyNote = song.melody[correctCount % song.melody.length];
                const freq = NOTES[melodyNote] || 261.63;
                playPianoTone(freq);

                correctCount++;
                combo++;
                if (combo > maxCombo) maxCombo = combo;

                renderTextDisplay();
                highlightNextKeyOnKeyboard();
            } else {
                playDampTone();
                errors++;
                combo = 0;

                if (song.isPinyin) {
                    const segs = textContainer.getElementsByClassName('pinyin-segment');
                    const curSeg = segs[currentSegmentIndex];
                    if (curSeg) {
                        curSeg.classList.add('char-wrong');
                        setTimeout(() => curSeg.classList.remove('char-wrong'), 250);
                    }
                } else {
                    const spans = textContainer.getElementsByTagName('span');
                    const curSpan = spans[typedTextLength];
                    if (curSpan) {
                        curSpan.classList.add('char-wrong');
                        setTimeout(() => curSpan.classList.remove('char-wrong'), 250);
                    }
                }
            }

            updateStatsUI();
        }

        function updateStatsUI() {
            statCombo.innerText = combo;

            const accuracy = keystrokes > 0 ? Math.round(((keystrokes - errors) / keystrokes) * 100) : 100;
            statAcc.innerText = `${accuracy}%`;

            let wpm = 0;
            if (startTime) {
                const elapsedMin = (new Date() - startTime) / 1000 / 60;
                if (elapsedMin > 0) {
                    const letterTypedCount = SONGS[currentSongIndex].isPinyin 
                        ? getPinyinTypedLettersCount()
                        : typedTextLength;
                    wpm = Math.round((letterTypedCount / 5) / elapsedMin);
                }
            }
            statWpm.innerText = wpm;
        }

        function getPinyinTypedLettersCount() {
            const song = SONGS[currentSongIndex];
            let count = 0;
            for (let i = 0; i < currentSegmentIndex; i++) {
                count += song.segments[i].p.length;
            }
            count += currentPinyinCharIndex;
            return count;
        }

        // --- STREAMING_CHUNK: 编写结算勋章荣誉算法 ---
        function congratulateFinished() {
            setTimeout(() => {
                const accuracy = Math.round(((keystrokes - errors) / keystrokes) * 100);
                
                let wpm = 0;
                if (startTime) {
                    const elapsedMin = (new Date() - startTime) / 1000 / 60;
                    const letterTypedCount = SONGS[currentSongIndex].isPinyin 
                        ? getPinyinTypedLettersCount()
                        : typedTextLength;
                    wpm = Math.round((letterTypedCount / 5) / elapsedMin);
                }

                let rankTitle = "见习音乐仙女 ✨";
                if (accuracy >= 96 && wpm >= 42) rankTitle = "星光至尊琴魔 👑";
                else if (accuracy >= 92 && wpm >= 28) rankTitle = "精灵大琴师 🦄";
                else if (accuracy >= 80) rankTitle = "星空吟游乐徒 🎵";

                document.getElementById('report-wpm').innerText = wpm;
                document.getElementById('report-acc').innerText = `${accuracy}%`;
                document.getElementById('report-combo').innerText = maxCombo;
                document.getElementById('report-title').innerText = rankTitle;

                successModal.style.display = "flex";
            }, 600);
        }

        // 绑定各种面板控制点击事件
        btnEnter.addEventListener('click', () => {
            initAudio();
            welcomeModal.style.display = 'none';
            loadSong(0); 
        });

        btnReplay.addEventListener('click', () => {
            successModal.style.display = "none";
            loadSong(currentSongIndex);
        });

        btnNext.addEventListener('click', () => {
            successModal.style.display = "none";
            let nextIndex = (currentSongIndex + 1) % SONGS.length;
            songSelect.value = nextIndex;
            loadSong(nextIndex);
        });

        songSelect.addEventListener('change', (e) => {
            loadSong(parseInt(e.target.value));
        });

        themeSelect.addEventListener('change', (e) => {
            changeTheme(e.target.value);
        });

        btnAutoplay.addEventListener('click', () => {
            toggleAutoPlay();
        });

        // 初始化默认星空主题
        changeTheme("starlight");
    </script>
</body>
</html>
