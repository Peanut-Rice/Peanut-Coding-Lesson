<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A7576">
<title>锦鲤池 · 养一池鱼</title>
<meta name="description" content="给孩子的锦鲤池：敲敲水面看波纹，按住撒一把鱼食，鱼会围过来抢；慢慢移动手指，好奇的鱼会跟着你游。没有分数，没有目标，单文件离线可用，累了就来喂喂鱼。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
<style>
  :root{
    --deep:#0B2A2C; --teal:#2C7A7B; --jade:#BFE3D0; --cream:#F6F3E6; --gold:#F2C46B;
    --settle:cubic-bezier(.16,.84,.24,1);
    --breath:cubic-bezier(.3,.05,.15,1);
    --ui:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    position:fixed; inset:0; overflow:hidden;
    background:#BFE3D0; color:var(--cream);
    font-family:var(--ui);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #pond{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    touch-action:none; cursor:none; outline:none;
  }
  #pond:focus-visible{outline:2px solid rgba(246,243,230,.85); outline-offset:-8px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0}

  /* ---------- 顶上的招牌 ---------- */
  .top-fade{
    position:absolute; left:0; right:0; top:0; height:clamp(116px,19vh,196px);
    pointer-events:none; z-index:4;
    background:linear-gradient(180deg,rgba(4,22,24,.5) 0%,rgba(4,22,24,.27) 46%,rgba(4,22,24,0) 100%);
  }
  .bot-fade{
    position:absolute; left:0; right:0; bottom:0; height:clamp(104px,16vh,150px);
    pointer-events:none; z-index:4;
    background:linear-gradient(0deg,rgba(4,22,24,.44) 0%,rgba(4,22,24,.16) 52%,rgba(4,22,24,0) 100%);
  }
  .back-home{
    position:absolute; left:12px; top:12px; z-index:9;
    display:inline-flex; align-items:center; gap:6px; min-height:40px;
    padding:8px 14px; border-radius:999px; text-decoration:none;
    background:rgba(6,28,30,.74); border:1px solid rgba(246,243,230,.26);
    color:rgba(250,248,238,.94); font-size:13px; font-weight:600;
    transition:background .3s var(--settle), border-color .3s var(--settle);
  }
  .back-home:hover,.back-home:focus-visible{background:rgba(18,56,58,.85); border-color:rgba(246,243,230,.55)}
  .back-home i{font-style:normal; font-size:15px; line-height:1}

  .topbar{
    position:absolute; left:50%; top:10px; z-index:6; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:9px;
    pointer-events:none; text-align:center; width:max-content; max-width:min(74vw,520px);
  }
  .topbar h1{
    margin:0; font-weight:500; color:rgba(252,250,240,.96);
    font-size:clamp(19px,3.4vw,27px); letter-spacing:.4em; text-indent:.4em;
    text-shadow:0 2px 22px rgba(3,18,20,.7), 0 1px 2px rgba(3,18,20,.45);
  }
  .hint{
    display:inline-flex; align-items:center; gap:7px; margin:0;
    padding:6px 14px 7px; border-radius:999px;
    background:rgba(6,28,30,.64); border:1px solid rgba(246,243,230,.22);
    color:rgba(248,246,236,.88); font-size:clamp(11.5px,1.6vw,13.5px); letter-spacing:.04em;
    transition:opacity .8s var(--settle), transform .8s var(--settle);
    white-space:nowrap;
  }
  .hint b{color:var(--gold); font-weight:600}
  .hint.gone{opacity:0; transform:translateY(-8px)}
  .hint .dot{
    width:6px; height:6px; border-radius:50%; background:var(--gold); flex:none;
    box-shadow:0 0 10px rgba(242,196,107,.9); animation:pulse 2.4s var(--breath) infinite;
  }
  @keyframes pulse{0%,100%{opacity:.45; transform:scale(.8)}50%{opacity:1; transform:scale(1.15)}}

  .tasks-btn{
    position:absolute; right:12px; top:12px; z-index:9;
    display:inline-flex; align-items:center; gap:7px; min-height:40px;
    padding:8px 14px; border-radius:999px;
    background:rgba(6,28,30,.74); border:1px solid rgba(246,243,230,.26);
    color:rgba(250,248,238,.94); font-family:var(--ui); font-size:13px; font-weight:600;
    cursor:pointer;
    transition:background .3s var(--settle), border-color .3s var(--settle);
  }
  .tasks-btn:hover,.tasks-btn:focus-visible{background:rgba(18,56,58,.85); border-color:rgba(246,243,230,.55)}
  .tasks-btn b{font-weight:600; color:var(--gold); font-size:11.5px; letter-spacing:.06em}

  /* ---------- 水下的名字签 ---------- */
  .fish-tag{
    position:fixed; left:0; top:0; z-index:8;
    display:flex; align-items:center; gap:7px;
    padding:7px 12px 8px; border-radius:999px;
    background:rgba(5,26,28,.9); border:1px solid rgba(242,196,107,.48);
    box-shadow:0 10px 28px rgba(0,0,0,.3);
    color:#FFF8E8; font-family:var(--ui); font-size:12.5px; font-weight:600;
    letter-spacing:.08em; white-space:nowrap; pointer-events:none;
    opacity:0; transform:translate(-50%,-100%);
    transition:opacity .28s var(--settle);
  }
  .fish-tag.on{opacity:1}
  .fish-tag b{font-weight:700; color:#FFE8B4}
  .fish-tag .sw{
    width:11px; height:11px; border-radius:50%; flex:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.18), 0 0 0 1px rgba(246,243,230,.4);
  }
  .fish-tag .sub{font-size:10.5px; font-weight:500; letter-spacing:.16em; color:rgba(246,243,230,.55)}

  /* ---------- 池边的操作条 ---------- */
  .sill{
    position:absolute; left:calc(14px + env(safe-area-inset-left)); right:calc(14px + env(safe-area-inset-right));
    bottom:calc(14px + env(safe-area-inset-bottom)); z-index:7;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    pointer-events:none;
  }
  .caption{
    margin:0; padding:5px 11px 6px; border-radius:999px;
    background:rgba(6,28,30,.55); border:1px solid rgba(246,243,230,.14);
    font-size:11.5px; letter-spacing:.05em; line-height:1.3;
    color:rgba(246,243,230,.88); text-shadow:0 1px 6px rgba(4,20,22,.6);
    white-space:nowrap;
    opacity:0; transform:translateY(5px);
    transition:opacity .7s var(--settle), transform .7s var(--settle);
  }
  .caption.on{opacity:1; transform:none}
  .sill-actions{display:flex; align-items:center; gap:8px; pointer-events:none}

  .chip{
    pointer-events:auto; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:44px; padding:8px 13px; border-radius:999px;
    border:1px solid rgba(246,243,230,.28);
    background:rgba(6,28,30,.66); color:rgba(246,243,230,.9);
    font-family:var(--ui); font-size:12.5px; font-weight:600; letter-spacing:.06em;
    cursor:pointer;
    transition:background .3s var(--settle), color .3s var(--settle), border-color .3s var(--settle), transform .2s var(--settle);
  }
  .chip:hover,.chip:focus-visible{background:rgba(18,56,58,.82); color:#fff; border-color:rgba(246,243,230,.55)}
  .chip svg{width:19px; height:14px; flex:none; overflow:visible}
  .chip.sound[aria-pressed="true"]{color:#FFE8B4; border-color:rgba(242,196,107,.6)}
  .chip.sound[aria-pressed="true"] .droplet{fill:rgba(242,196,107,.35)}

  .feed-btn{
    pointer-events:auto; display:inline-flex; align-items:center; justify-content:center; gap:7px;
    min-height:46px; padding:9px 17px 10px; border-radius:999px; border:1px solid rgba(255,238,200,.75);
    background:linear-gradient(180deg,#F7D289 0%,#EFB95F 100%);
    color:#3A2606; font-family:var(--ui); font-size:14px; font-weight:700; letter-spacing:.08em;
    cursor:pointer; box-shadow:0 8px 22px rgba(60,30,0,.28), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .18s var(--settle), box-shadow .3s var(--settle), filter .3s var(--settle);
  }
  .feed-btn:hover{filter:brightness(1.04); box-shadow:0 10px 26px rgba(60,30,0,.34), inset 0 1px 0 rgba(255,255,255,.6)}
  .feed-btn:active{transform:scale(.96)}
  .feed-btn svg{width:17px; height:17px; flex:none}
  .feed-btn:focus-visible{outline:2px solid #FFF6E0; outline-offset:2px}

  @media (max-width:760px){
    .back-home,.tasks-btn{padding:7px 11px; font-size:12px}
    .tasks-btn b{font-size:11px}
    .caption{font-size:11px}
  }
  @media (max-width:400px){
    .topbar h1{font-size:18px}
    .hint{font-size:11px; padding:5px 11px 6px; gap:6px}
    .feed-btn{font-size:13.5px; padding:8px 15px 9px; min-height:44px}
    .chip{font-size:12px; padding:7px 11px}
  }
  @media (max-width:380px){
    .topbar{gap:0}
    .hint{margin-top:20px}
  }
  @media (max-width:350px){
    .topbar{gap:0}
    .topbar h1{font-size:17px}
    .hint{margin-top:26px; font-size:10.5px; padding:5px 10px 6px; letter-spacing:0}
    .back-home,.tasks-btn{padding:6px 9px; font-size:11px}
    .tasks-btn b{font-size:10px}
    .caption{font-size:10px; padding:4px 9px 5px}
  }

  /* ---------- 小抽屉：为什么、四件小事 ---------- */
  .scrim{
    position:fixed; inset:0; z-index:18; background:rgba(3,18,20,.66);
    opacity:0; pointer-events:none; transition:opacity .45s var(--settle);
  }
  .scrim.open{opacity:1; pointer-events:auto}
  .sheet{
    position:fixed; left:50%; bottom:0; z-index:19; width:min(560px,100%);
    max-height:88vh; max-height:88dvh; overflow:auto; -webkit-overflow-scrolling:touch;
    transform:translate(-50%,104%); transition:transform .55s var(--settle);
    padding:24px clamp(18px,5vw,30px) calc(26px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#17403F 0%,#0E2C2E 55%,#0A2224 100%);
    border:1px solid rgba(242,196,107,.2); border-bottom:0; border-radius:24px 24px 0 0;
    box-shadow:0 -26px 70px rgba(0,0,0,.55);
    color:rgba(246,243,230,.9); font-family:var(--ui);
  }
  .sheet.open{transform:translate(-50%,0)}
  .sheet-close{
    position:absolute; right:14px; top:14px; width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:rgba(246,243,230,.08); border:1px solid rgba(246,243,230,.22); color:rgba(250,248,238,.9);
    font-size:16px; line-height:1;
  }
  .sheet-close:hover{background:rgba(246,243,230,.16)}
  .sheet h2{
    margin:0 0 12px; font-size:17px; font-weight:600; letter-spacing:.05em; color:#FBF7E9;
    display:flex; align-items:baseline; gap:9px;
  }
  .sheet h2 small{font-size:10.5px; font-weight:400; letter-spacing:.2em; color:rgba(246,243,230,.45); text-transform:uppercase}
  .sheet p{margin:0 0 13px; font-size:13.5px; line-height:1.95; color:rgba(226,236,226,.82)}
  .sheet p b{color:#FFF6DA; font-weight:600}
  .sheet .tasks-head{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    margin:20px 0 10px; padding-top:18px; border-top:1px solid rgba(246,243,230,.14);
    font-size:15px; font-weight:600; letter-spacing:.05em; color:#FBF7E9;
  }
  .sheet .tasks-head span{font-size:11.5px; font-weight:600; letter-spacing:.14em; color:var(--gold)}
  .tasks{display:grid; gap:8px}
  .task{
    display:flex; align-items:flex-start; gap:11px; padding:11px 13px; border-radius:14px;
    background:rgba(246,243,230,.05); border:1px solid rgba(246,243,230,.1);
    transition:background .3s var(--settle), border-color .3s var(--settle);
  }
  .task .tick{
    flex:none; width:20px; height:20px; margin-top:1px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(246,243,230,.35); color:transparent; font-size:12px; line-height:1;
    transition:all .3s var(--settle);
  }
  .task p{margin:0; font-size:13px; line-height:1.55; color:rgba(240,238,226,.9)}
  .task small{display:block; margin-top:2px; font-size:11.5px; line-height:1.5; color:rgba(210,220,208,.55); letter-spacing:.02em}
  .task.done{background:rgba(242,196,107,.1); border-color:rgba(242,196,107,.32)}
  .task.done .tick{background:var(--gold); border-color:var(--gold); color:#2A2606}
  .task.done p{color:#fff}
  .foot-home{
    margin:22px 0 0; padding-top:16px; border-top:1px solid rgba(246,243,230,.14);
    text-align:center; font-size:13px;
  }
  .foot-home a{color:rgba(246,243,230,.72); text-decoration:none; border-bottom:1px dotted rgba(246,243,230,.35); padding-bottom:2px}
  .foot-home a:hover,.foot-home a:focus-visible{color:#fff; border-color:var(--gold)}

  .toast{
    position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:21;
    transform:translate(-50%,16px); opacity:0; pointer-events:none;
    max-width:calc(100vw - 28px); overflow:hidden; text-overflow:ellipsis;
    padding:10px 18px; border-radius:999px; background:rgba(7,32,34,.95);
    border:1px solid rgba(242,196,107,.45); color:#FFF4E2;
    font-family:var(--ui); font-size:13px; letter-spacing:.03em; white-space:nowrap;
    box-shadow:0 14px 40px rgba(0,0,0,.45);
    transition:opacity .35s var(--settle), transform .45s var(--settle);
  }
  .toast.show{opacity:1; transform:translate(-50%,0)}

  @media (max-width:520px){
    .sheet{padding-top:20px}
    .sheet h2{font-size:16px; margin-bottom:10px}
    .sheet p{font-size:13px; line-height:1.85; margin-bottom:11px}
    .sheet .tasks-head{margin:14px 0 8px; padding-top:14px; font-size:14px}
    .task{padding:9px 12px}
    .task p{font-size:12.5px}
    .task small{font-size:11px}
    .foot-home{margin-top:16px; padding-top:12px}
  }
  @media (prefers-reduced-motion:reduce){
    .hint,.caption,.fish-tag,.toast{transition-duration:.01s}
    .hint .dot{animation:none; opacity:.8}
    .feed-btn:active{transform:none}
  }
</style>
</head>
<body>
<main class="window">
  <canvas id="pond" tabindex="0" role="img" aria-label="一池锦鲤，从上往下看。点一下水面会有波纹，按住会撒鱼食，鱼会围过来；手指慢慢移动，会有鱼跟着你。点一条鱼，它会告诉你它是什么锦鲤。键盘：回车敲水面，空格撒鱼食。"></canvas>
  <p class="sr">养一池鱼：敲敲水面，按住撒食，慢慢移动手指</p>

  <div class="top-fade" aria-hidden="true"></div>
  <div class="bot-fade" aria-hidden="true"></div>

  <a class="back-home" href="index.html"><i aria-hidden="true">←</i>乐园</a>

  <div class="topbar">
    <h1>锦鲤池</h1>
    <p class="hint" id="hint"><span class="dot" aria-hidden="true"></span>敲敲水面 · <b>按住撒鱼食</b></p>
  </div>

  <button class="tasks-btn" id="openTasks" type="button" aria-haspopup="dialog">四件小事 <b id="taskCount">0/4</b></button>

  <div class="fish-tag" id="fishTag" aria-hidden="true"><span class="sw" id="tagSw"></span><b id="tagName">红白</b><span class="sub">锦鲤</span></div>

  <div class="sill">
    <p class="caption" id="fedCount">今天还没喂鱼</p>
    <div class="sill-actions">
      <button class="chip sound" id="sound" type="button" aria-pressed="false" aria-label="声音：水声和鱼嘴的吧嗒声">
        <svg viewBox="0 0 22 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path class="droplet" d="M11 2.2c0 0-3.7 4.3-3.7 6.5a3.7 3.7 0 0 0 7.4 0C14.7 6.5 11 2.2 11 2.2Z"/>
          <path d="M3.2 14.3q1.95-1.2 3.9 0t3.9 0 3.9 0 3.9 0" opacity=".75"/>
        </svg>
        <span class="sound-label" id="soundLabel">声音</span>
      </button>
      <button class="feed-btn" id="feedBtn" type="button" aria-label="撒一把鱼食">
        <svg viewBox="0 0 18 18" aria-hidden="true" fill="currentColor">
          <circle cx="4.6" cy="3.6" r="1.35"/><circle cx="9.2" cy="2.2" r="1.15"/><circle cx="13.4" cy="4.4" r="1.45"/><circle cx="7" cy="6.8" r="1"/>
          <path d="M2.4 10.2h13.2c-.5 3.4-2.9 5.3-6.6 5.3s-6.1-1.9-6.6-5.3Z" opacity=".92"/>
        </svg>
        喂一把
      </button>
    </div>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <button class="sheet-close" id="closeTasks" type="button" aria-label="关上">✕</button>
  <h2 id="sheetTitle">鱼为什么跟着手指？</h2>
  <p>锦鲤的眼睛长在头的两边，左边右边都看得见，正前方反而看不太准。</p>
  <p>可是它对<b>动的东西</b>特别敏感——水一晃，它就知道有谁来了。</p>
  <p>所以它跟着你，一半是好奇，一半是等你撒吃的。</p>
  <p>先到它身边的，其实是水波；你还没碰到它，它已经转过身了。</p>
  <div class="tasks-head">顺手做四件小事 <span id="taskCount2">0 / 4</span></div>
  <div class="tasks" id="tasks"></div>
  <p style="margin-top:16px;font-size:12.5px;color:rgba(210,220,208,.6)">小提示：不用做什么，坐着看一会儿也很好。鱼自己会游、会打哈欠似的张嘴喝水。</p>
  <p class="foot-home"><a href="index.html">← 回到 Peanut 的编程乐园</a></p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

const cv = document.getElementById('pond');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
let calm = mq.matches;
const bootAt = performance.now();

let W = 0, H = 0, DPR = 1, S = 1, M = 0, T = 0, last = 0, raf = 0, frameN = 0;

/* ---------- 小工具 ---------- */
function rngf(seed){
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = rngf(20241112);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function hex(h){ return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(a, b, t, al){
  const A = hex(a), B = hex(b);
  const s = Math.round(lerp(A[0], B[0], t)) + ',' + Math.round(lerp(A[1], B[1], t)) + ',' + Math.round(lerp(A[2], B[2], t));
  return al === undefined ? 'rgb(' + s + ')' : 'rgba(' + s + ',' + al + ')';
}
function angd(a, b){
  let d = (a - b) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}
/* 用一条平滑的闭合曲线连接一串点 */
function smooth(c, p, n){
  const lx = p[n * 2 - 2], ly = p[n * 2 - 1];
  c.moveTo((lx + p[0]) / 2, (ly + p[1]) / 2);
  for (let i = 0; i < n; i++){
    const x = p[i * 2], y = p[i * 2 + 1];
    const j = (i + 1) % n;
    c.quadraticCurveTo(x, y, (x + p[j * 2]) / 2, (y + p[j * 2 + 1]) / 2);
  }
  c.closePath();
}

const C = {
  teal: '#2C7A7B', deep: '#14323A', jade: '#BFE3D0', orange: '#F26B21', white: '#FFFFFF',
  black: '#1B1B1B', yolk: '#F2B33D', padA: '#3E8E5A', padB: '#6DB37C', lotus: '#F7C6D0'
};
const NAME = { kohaku: '红白', showa: '昭和', ogon: '黄金', tancho: '丹顶' };
const SWATCH = {
  kohaku: 'linear-gradient(135deg,#ffffff 0 46%,#F26B21 46% 100%)',
  showa: 'linear-gradient(135deg,#1B1B1B 0 58%,#ffffff 58% 100%)',
  ogon: '#F2B33D',
  tancho: 'radial-gradient(circle at 50% 42%,#E23B2E 0 34%,#ffffff 36% 100%)'
};

/* ---------- 离屏图层 ---------- */
const floorCv = document.createElement('canvas');
const stoneCv = document.createElement('canvas');
let bgCv = null;
const causCv = document.createElement('canvas');
const causCtx = causCv.getContext('2d');
const causTexCv = document.createElement('canvas');
const causMaskCv = document.createElement('canvas');
let causScale = 1, causMask = null;

/* ---------- 池子里的数组 ---------- */
const stones = [], pads = [], leaves = [], fish = [], pellets = [], ripples = [];
let ripId = 0, follower = null, followT = 0, followClock = 0;

/* =====================================================================
   池边：一圈不规则的石头
   ===================================================================== */
function buildStones(){
  const r = rngf(977);
  stones.length = 0;
  const mm = clamp(M, 340, 900);
  const corners = [[0, 0, 0.31], [W, H, 0.24], [W, 0, 0.15], [0, H, 0.13]];
  corners.forEach(c => {
    const cx = c[0], cy = c[1], R = c[2] * mm;
    const sx = cx ? -1 : 1, sy = cy ? -1 : 1;
    const mk = (x, y, rad) => {
      const v = [];
      for (let i = 0; i < 10; i++) v.push(0.84 + r() * 0.3);
      stones.push({ x, y, r: rad, v, rot: r() * TAU, tone: 0.13 + r() * 0.24, moss: r(), seed: Math.floor(r() * 1e6) });
    };
    mk(cx + sx * R * 0.14, cy + sy * R * 0.12, R * 0.66);
    const n = 3 + Math.floor(r() * 2) + (c[2] > 0.2 ? 2 : 0);
    for (let i = 0; i < n; i++){
      const a = (i + 0.5) / n * Math.PI / 2 + (r() - 0.5) * 0.22;
      const d = R * (0.8 + r() * 0.26);
      mk(cx + sx * Math.cos(a) * d, cy + sy * Math.sin(a) * d, R * (0.21 + r() * 0.2));
    }
    for (let k = 0; k < 4; k++){
      const a2 = r() * Math.PI / 2, d2 = R * (1.12 + r() * 0.3);
      mk(cx + sx * Math.cos(a2) * d2, cy + sy * Math.sin(a2) * d2, R * (0.045 + r() * 0.06));
    }
  });
}
function stonePath(c, s){
  const p = [], n = s.v.length;
  for (let i = 0; i < n; i++){
    const a = s.rot + i / n * TAU;
    p.push(s.x + Math.cos(a) * s.r * s.v[i], s.y + Math.sin(a) * s.r * s.v[i]);
  }
  c.beginPath();
  smooth(c, p, n);
}
function paintStones(){
  stoneCv.width = Math.round(W * DPR); stoneCv.height = Math.round(H * DPR);
  const c = stoneCv.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  const order = stones.slice().sort((a, b) => b.r - a.r);
  order.forEach(s => {
    const r = rngf(s.seed);
    /* 湿边和投进水里的影子 */
    c.save();
    c.shadowColor = 'rgba(20,50,58,.42)';
    c.shadowBlur = 16 * S + s.r * 0.08;
    c.shadowOffsetX = (5 + s.r * 0.04) * DPR; c.shadowOffsetY = (8 + s.r * 0.06) * DPR;
    stonePath(c, s);
    const g = c.createLinearGradient(s.x - s.r, s.y - s.r, s.x + s.r, s.y + s.r);
    g.addColorStop(0, mix(C.white, C.deep, Math.max(0.03, s.tone - 0.1)));
    g.addColorStop(0.5, mix(C.white, C.deep, s.tone + 0.06));
    g.addColorStop(1, mix(C.white, C.deep, s.tone + 0.34));
    c.fillStyle = g;
    c.fill();
    c.restore();

    c.save();
    stonePath(c, s);
    c.clip();
    c.fillStyle = 'rgba(242,179,61,.09)';
    c.fillRect(s.x - s.r * 1.3, s.y - s.r * 1.3, s.r * 2.6, s.r * 2.6);
    const hg = c.createRadialGradient(s.x - s.r * 0.3, s.y - s.r * 0.35, 0, s.x - s.r * 0.3, s.y - s.r * 0.35, s.r * 0.9);
    hg.addColorStop(0, 'rgba(255,255,255,.5)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hg;
    c.fillRect(s.x - s.r * 1.3, s.y - s.r * 1.3, s.r * 2.6, s.r * 2.6);
    /* 石头的麻点 */
    const sp = Math.round(s.r * s.r / 26);
    for (let i = 0; i < sp; i++){
      const a = r() * TAU, d = Math.sqrt(r()) * s.r * 1.1;
      c.fillStyle = r() > 0.5 ? 'rgba(20,50,58,' + (0.04 + r() * 0.09) + ')' : 'rgba(255,255,255,' + (0.08 + r() * 0.16) + ')';
      c.beginPath();
      c.arc(s.x + Math.cos(a) * d, s.y + Math.sin(a) * d, 0.4 + r() * 1.5 * S, 0, TAU);
      c.fill();
    }
    /* 一两条石纹 */
    if (s.r > 26){
      c.strokeStyle = 'rgba(20,50,58,.13)'; c.lineWidth = 0.8;
      for (let q = 0; q < 2; q++){
        const a0 = r() * TAU, x0 = s.x + Math.cos(a0) * s.r, y0 = s.y + Math.sin(a0) * s.r;
        c.beginPath(); c.moveTo(x0, y0);
        const a1 = a0 + Math.PI + (r() - 0.5) * 1.2;
        c.quadraticCurveTo(s.x + (r() - 0.5) * s.r, s.y + (r() - 0.5) * s.r, s.x + Math.cos(a1) * s.r * 0.4, s.y + Math.sin(a1) * s.r * 0.4);
        c.stroke();
      }
    }
    /* 边缘的亮和暗 */
    c.lineWidth = Math.max(2, s.r * 0.09);
    c.strokeStyle = 'rgba(20,50,58,.26)';
    c.translate(-1.5, -2.5); stonePath(c, s); c.stroke();
    c.translate(3, 5); c.strokeStyle = 'rgba(255,255,255,.4)'; stonePath(c, s); c.stroke();
    c.translate(-1.5, -2.5);
    /* 苔藓 */
    if (s.r > 12 && s.moss > 0.18){
      const patches = 2 + Math.floor(s.moss * 3);
      for (let m = 0; m < patches; m++){
        const ma = r() * TAU, mr = s.r * (0.55 + r() * 0.4), ms = s.r * (0.22 + r() * 0.3);
        const mx = s.x + Math.cos(ma) * mr, my = s.y + Math.sin(ma) * mr;
        const dots = Math.round(30 + ms * 2.2);
        for (let k = 0; k < dots; k++){
          const da = r() * TAU, dd = Math.pow(r(), 0.7) * ms, dr = (1.2 + r() * 3.4) * S * (1 - dd / ms * 0.55);
          const px = mx + Math.cos(da) * dd, py = my + Math.sin(da) * dd;
          c.fillStyle = 'rgba(20,50,58,.2)';
          c.beginPath(); c.arc(px + 0.8, py + 1.2, dr, 0, TAU); c.fill();
          c.fillStyle = mix(C.padA, C.padB, r() * 0.6, 0.92);
          c.beginPath(); c.arc(px, py, dr, 0, TAU); c.fill();
          if (r() > 0.45){
            c.fillStyle = mix(C.padB, C.jade, r() * 0.5, 0.85);
            c.beginPath(); c.arc(px - dr * 0.3, py - dr * 0.35, dr * 0.45, 0, TAU); c.fill();
          }
        }
      }
    }
    c.restore();
  });
}
function onStone(x, y){
  for (let i = 0; i < stones.length; i++){
    const s = stones[i];
    if (Math.hypot(x - s.x, y - s.y) < s.r * 0.93) return true;
  }
  return false;
}

/* ---------- 池底：浅处青玉，深处墨绿 ---------- */
function depthAt(x, y){
  const ax = clamp(Math.abs(2 * x / W - 1), 0, 1), ay = clamp(Math.abs(2 * y / H - 1), 0, 1);
  let e = 1 - Math.cbrt(ax * ax * ax + ay * ay * ay);
  e += 0.07 * Math.sin(x * 0.0052 / S + 1.3) * Math.sin(y * 0.0066 / S + 0.4) + 0.04 * Math.sin((x + y) * 0.011 / S + 2.2) * Math.cos((x - y) * 0.009 / S);
  for (let i = 0; i < stones.length; i++){
    const s = stones[i];
    const d = (Math.hypot(x - s.x, y - s.y) - s.r) / (M * 0.4);
    if (d < e) e = d;
  }
  return clamp(e, 0, 1);
}
const RAMP = [[0, hex(C.jade)], [0.19, [116, 186, 170]], [0.52, hex(C.teal)], [1, [22, 60, 70]]];
function ramp(e, out){
  e = Math.pow(e, 1.12);
  for (let i = 1; i < RAMP.length; i++){
    if (e <= RAMP[i][0]){
      const a = RAMP[i - 1], b = RAMP[i], t = (e - a[0]) / (b[0] - a[0]);
      const tt = t * t * (3 - 2 * t);
      out[0] = lerp(a[1][0], b[1][0], tt); out[1] = lerp(a[1][1], b[1][1], tt); out[2] = lerp(a[1][2], b[1][2], tt);
      return;
    }
  }
  out[0] = RAMP[3][1][0]; out[1] = RAMP[3][1][1]; out[2] = RAMP[3][1][2];
}
function paintFloor(){
  floorCv.width = Math.round(W); floorCv.height = Math.round(H);
  const c = floorCv.getContext('2d');
  const q = 5, gw = Math.ceil(W / q) + 1, gh = Math.ceil(H / q) + 1;
  const t = document.createElement('canvas'); t.width = gw; t.height = gh;
  const tc = t.getContext('2d'), img = tc.createImageData(gw, gh), d = img.data, col = [0, 0, 0];
  const r = rngf(4411);
  for (let y = 0; y < gh; y++){
    for (let x = 0; x < gw; x++){
      ramp(depthAt(x * q, y * q), col);
      const k = (y * gw + x) * 4, n = (r() - 0.5) * 5;
      d[k] = col[0] + n; d[k + 1] = col[1] + n; d[k + 2] = col[2] + n; d[k + 3] = 255;
    }
  }
  tc.putImageData(img, 0, 0);
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(t, 0, 0, gw * q, gh * q);
  /* 池底的小石子：浅处清楚，深处糊掉 */
  const count = Math.round(W * H / 1250);
  for (let i = 0; i < count; i++){
    const px = r() * W, py = r() * H, e = depthAt(px, py);
    const vis = Math.pow(1 - e, 1.6) + 0.12;
    const rad = (1.6 + r() * r() * 7.5) * S, rot = r() * Math.PI, sq = 0.6 + r() * 0.4;
    const light = r() > 0.45;
    c.fillStyle = 'rgba(20,50,58,' + (0.10 * vis) + ')';
    c.beginPath(); c.ellipse(px + rad * 0.25, py + rad * 0.4, rad, rad * sq, rot, 0, TAU); c.fill();
    c.fillStyle = light ? 'rgba(255,255,255,' + ((0.10 + r() * 0.16) * vis) + ')' : 'rgba(20,50,58,' + ((0.07 + r() * 0.12) * vis) + ')';
    c.beginPath(); c.ellipse(px, py, rad, rad * sq, rot, 0, TAU); c.fill();
    if (light && rad > 3 * S){
      c.fillStyle = 'rgba(255,255,255,' + (0.16 * vis) + ')';
      c.beginPath(); c.ellipse(px - rad * 0.25, py - rad * 0.25, rad * 0.45, rad * sq * 0.4, rot, 0, TAU); c.fill();
    }
  }
}

/* ---------- 池底和石头合成为一张底图，每帧只贴一次 ---------- */
function composeBackground(){
  if (!bgCv) bgCv = document.createElement('canvas');
  bgCv.width = Math.round(W * DPR); bgCv.height = Math.round(H * DPR);
  const b = bgCv.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  b.drawImage(floorCv, 0, 0, W, H);
  b.drawImage(stoneCv, 0, 0, W, H);
  /* 水面上斜斜的一片天光，一次画进底图 */
  const sg = b.createLinearGradient(0, 0, W * 0.75, H);
  sg.addColorStop(0, 'rgba(255,255,255,.2)'); sg.addColorStop(0.45, 'rgba(255,255,255,.03)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
  b.fillStyle = sg; b.fillRect(0, 0, W, H);
  b.setTransform(1, 0, 0, 1, 0, 0);
  floorCv.width = 1; floorCv.height = 1;
  stoneCv.width = 1; stoneCv.height = 1;
}

/* ---------- 水光：低分辨率算一次，再放大 ---------- */
function setupCaustics(){
  const cell = Math.max(W, H) / 224;
  const cw = Math.max(8, Math.round(W / cell)), ch = Math.max(8, Math.round(H / cell));
  causCv.width = cw; causCv.height = ch;
  causTexCv.width = Math.ceil(cw * 1.5); causTexCv.height = Math.ceil(ch * 1.5);
  causMaskCv.width = cw; causMaskCv.height = ch;
  causScale = TAU * (Math.max(W, H) / (S * 250)) / Math.max(cw, ch);
  causMask = new Float32Array(cw * ch);

  /* 深的地方水光弱一点；这张蒙版一直贴在屏幕上不动 */
  const mctx = causMaskCv.getContext('2d');
  const mimg = mctx.createImageData(cw, ch), md = mimg.data;
  for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++){
    const me = depthAt((x + 0.5) * W / cw, (y + 0.5) * H / ch);
    const a = (1 - 0.62 * me * me) * (0.7 + 0.3 * Math.min(1, me * 4));
    const q = y * cw + x;
    causMask[q] = a;
    md[q * 4] = 255; md[q * 4 + 1] = 255; md[q * 4 + 2] = 236; md[q * 4 + 3] = Math.round(a * 255);
  }
  mctx.putImageData(mimg, 0, 0);

  /* 水光的花纹只在换尺寸时算一次，之后每帧只是把这张图挪一挪 */
  paintCausticTexture(3.1);
  updateCaustics(0);
}

function paintCausticTexture(time){
  const cw = causTexCv.width, ch = causTexCv.height;
  const tctx = causTexCv.getContext('2d');
  const img = tctx.createImageData(cw, ch), d = img.data;
  const sc = causScale, inten = 0.005;
  let q = 0;
  for (let y = 0; y < ch; y++){
    const py = y * sc - 250;
    for (let x = 0; x < cw; x++){
      const px = x * sc - 250;
      let ix = px, iy = py, c = 1;
      for (let n = 0; n < 3; n++){
        const t = time * (1 - 3.5 / (n + 1));
        const nx = px + Math.cos(t - ix) + Math.sin(t + iy);
        const ny = py + Math.sin(t - iy) + Math.cos(t + ix);
        ix = nx; iy = ny;
        const a = px / (Math.sin(ix + t) / inten), b = py / (Math.cos(iy + t) / inten);
        c += 1 / Math.sqrt(a * a + b * b);
      }
      c /= 3;
      c = 1.17 - Math.pow(c, 1.4);
      let v = c * c; v = v * v; v = v * v;
      const k = q * 4;
      d[k] = 255; d[k + 1] = 255; d[k + 2] = 236;
      d[k + 3] = Math.round((v > 1 ? 1 : v) * 255);
      q++;
    }
  }
  tctx.putImageData(img, 0, 0);
}

/* 两层同样的水光，错开速度挪动，看起来就一直在晃 */
function updateCaustics(t){
  const x = causCtx, cw = causCv.width, ch = causCv.height;
  const tw = causTexCv.width - cw, th = causTexCv.height - ch;
  const tt = calm ? 0 : t;
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'source-over';
  x.globalAlpha = 1;
  x.clearRect(0, 0, cw, ch);
  const ax = (0.5 + 0.44 * Math.sin(tt * 0.13 + 0.7)) * tw;
  const ay = (0.5 + 0.44 * Math.cos(tt * 0.09 + 1.1)) * th;
  x.globalAlpha = 1;
  x.drawImage(causTexCv, ax, ay, cw, ch, 0, 0, cw, ch);
  x.globalCompositeOperation = 'destination-in';
  x.globalAlpha = 1;
  x.drawImage(causMaskCv, 0, 0);
  x.globalCompositeOperation = 'source-over';
}

/* =====================================================================
   锦鲤：一条会摆的脊梁，身上带着自己的花纹
   ===================================================================== */
const NSEG = 14;
const PROF_S = [0, 0.012, 0.035, 0.07, 0.13, 0.22, 0.32, 0.45, 0.6, 0.75, 0.88, 1];
const PROF_W = [0, 0.036, 0.06, 0.08, 0.098, 0.113, 0.119, 0.11, 0.088, 0.06, 0.037, 0.023];
function wprof(s){
  if (s <= 0) return 0;
  if (s >= 1) return PROF_W[11];
  for (let i = 1; i < 12; i++){
    if (s <= PROF_S[i]) return lerp(PROF_W[i - 1], PROF_W[i], (s - PROF_S[i - 1]) / (PROF_S[i] - PROF_S[i - 1]));
  }
  return PROF_W[11];
}
const ORDER = ['kohaku', 'showa', 'ogon', 'tancho', 'kohaku', 'showa', 'kohaku', 'ogon', 'tancho', 'kohaku', 'showa'];

function blob(r, s, u, rs, ru, col, wob){
  const v = [];
  for (let i = 0; i < 12; i++) v.push(1 - wob / 2 + r() * wob);
  return { s, u, rs, ru, col, v };
}
function makePattern(f, r){
  const b = [];
  let i, n;
  f.base = '#FFFDF8'; f.fin = 'rgba(255,255,255,.66)';
  if (f.variety === 'kohaku'){
    n = 3 + Math.floor(r() * 3);
    for (i = 0; i < n; i++){
      b.push(blob(r, 0.07 + (i + r() * 0.7) / n * 0.86, (r() - 0.5) * 0.9, 0.07 + r() * 0.085, 0.75 + r() * 0.75, C.orange, 0.5));
    }
    if (r() > 0.4) b.push(blob(r, 0.2 + r() * 0.6, (r() > 0.5 ? 1 : -1) * 0.9, 0.035, 0.4, C.orange, 0.5));
  } else if (f.variety === 'showa'){
    n = 3;
    for (i = 0; i < n; i++) b.push(blob(r, 0.08 + (i + r() * 0.6) / n * 0.8, (r() - 0.5) * 0.8, 0.08 + r() * 0.07, 0.8 + r() * 0.6, C.orange, 0.5));
    n = 4 + Math.floor(r() * 2);
    for (i = 0; i < n; i++) b.push(blob(r, 0.04 + (i + r()) / n * 0.92, (r() - 0.5) * 1.7, 0.045 + r() * 0.07, 0.5 + r() * 0.8, C.black, 0.7));
    f.finDark = true;
  } else if (f.variety === 'tancho'){
    b.push(blob(r, 0.1, 0, 0.052, 0.66, C.orange, 0.14));
  } else {
    f.base = C.yolk; f.fin = 'rgba(246,200,110,.72)';
  }
  f.blobs = b;
}
function makeFish(i){
  const r = rngf(7001 + i * 131);
  const f = { variety: ORDER[i % ORDER.length] };
  let size = 0.25 + r() * 0.75;
  if (i === 0) size = 1;
  if (i === 3) size = 0.9;
  if (i === 5) size = 0.3;
  f.size = size;
  f.B = (58 + size * 80) * S;
  f.cruise = f.B * (0.5 + r() * 0.2);
  f.swirl = r() > 0.2 ? 1 : -1;
  f.tailK = 0.9 + r() * 0.3;
  makePattern(f, r);
  /* 从池子边上游进来，避开石头角 */
  const side = i % 4, u = 0.3 + r() * 0.4, out = f.B * (1.1 + r() * 0.9);
  if (side === 0){ f.x = -out; f.y = H * u; }
  else if (side === 1){ f.x = W * u; f.y = -out; }
  else if (side === 2){ f.x = W + out; f.y = H * u; }
  else { f.x = W * u; f.y = H + out; }
  f.h = Math.atan2(H * (0.3 + r() * 0.4) - f.y, W * (0.3 + r() * 0.4) - f.x);
  f.speed = f.cruise * 2.6; f.thrust = 1; f.phase = r() * TAU; f.paddle = r() * TAU;
  f.wander = 0; f.fleeT = 0; f.fleeA = 0; f.retT = 0; f.retD = 0; f.retX = 0; f.retY = 0;
  f.notice = 0; f.chew = 0; f.mouth = 0; f.enter = 1; f.gulp = 6 + r() * 30; f.bloopT = 0;
  f.nodes = new Float32Array(NSEG * 2);
  f.px = new Float32Array(NSEG); f.py = new Float32Array(NSEG);
  f.nx = new Float32Array(NSEG); f.ny = new Float32Array(NSEG);
  f.out = new Float32Array(46);
  const seg = f.B / (NSEG - 1);
  for (let k = 0; k < NSEG; k++){
    f.nodes[k * 2] = f.x - Math.cos(f.h) * seg * k;
    f.nodes[k * 2 + 1] = f.y - Math.sin(f.h) * seg * k;
  }
  return f;
}

function updateFish(f, dt){
  let fx = 0, fy = 0, vt = f.cruise, fast = false, turn = 1.7;
  let i, dx, dy, d, lim, k;
  f.wander += (rnd() - 0.5) * dt * 5; f.wander *= 1 - dt * 0.3;
  f.wander = clamp(f.wander, -1.1, 1.1);
  fx += Math.cos(f.h + f.wander); fy += Math.sin(f.h + f.wander);

  const m = f.B * 0.45 + 56 * S;
  if (f.x < m) fx += (m - f.x) / m * 3.2;
  if (f.x > W - m) fx -= (f.x - (W - m)) / m * 3.2;
  if (f.y < m) fy += (m - f.y) / m * 3.2;
  if (f.y > H - m) fy -= (f.y - (H - m)) / m * 3.2;
  const outside = f.x < -f.B * 0.2 || f.x > W + f.B * 0.2 || f.y < -f.B * 0.2 || f.y > H + f.B * 0.2;
  if (f.enter > 0){ if (!outside) f.enter -= dt * 0.8; vt = f.cruise * (1.2 + 1.6 * f.enter); fast = true; }

  for (i = 0; i < stones.length; i++){
    const s = stones[i];
    dx = f.x - s.x; dy = f.y - s.y; d = Math.hypot(dx, dy) || 1; lim = s.r + m * 0.75;
    if (d < lim){ k = (lim - d) / lim * 5; fx += dx / d * k; fy += dy / d * k; }
  }
  const feeding = pellets.length > 0 && f.fleeT <= 0;
  if (pellets.length && f.notice > 0) f.notice -= dt;
  if (!feeding){
    for (i = 0; i < pads.length; i++){
      const p = pads[i];
      dx = f.x - p.x; dy = f.y - p.y; d = Math.hypot(dx, dy) || 1; lim = p.r + f.B * 0.2;
      if (d < lim){ k = (lim - d) / lim * 0.8; fx += dx / d * k; fy += dy / d * k; }
    }
  }
  for (i = 0; i < fish.length; i++){
    const o = fish[i];
    if (o === f) continue;
    dx = f.x - o.x; dy = f.y - o.y; d = Math.hypot(dx, dy) || 1;
    lim = (f.B + o.B) * (feeding ? 0.25 : 0.42);
    if (d < lim){ k = (lim - d) / lim * (feeding ? 2.6 : 1.5); fx += dx / d * k; fy += dy / d * k; }
    /* 鼻子也别顶到别人的身子 */
    dx = f.x - o.nodes[12]; dy = f.y - o.nodes[13]; d = Math.hypot(dx, dy) || 1;
    lim = (f.B + o.B) * 0.16;
    if (d < lim){ k = (lim - d) / lim * 1.6; fx += dx / d * k; fy += dy / d * k; }
  }

  if (f.chew > 0) f.chew -= dt;
  if (f.mouth > 0) f.mouth = Math.max(0, f.mouth - dt * 1.7);

  if (f.fleeT > 0){
    f.fleeT -= dt;
    fx += Math.cos(f.fleeA) * 6; fy += Math.sin(f.fleeA) * 6;
    vt = f.cruise * 4.4; fast = true; turn = 7;
  } else if (feeding && f.notice <= 0){
    if (f.chew > 0){
      vt = f.cruise * 0.55;
      f.mouth = Math.max(f.mouth, 0.35);
    } else {
      let best = null, bd = 1e9;
      for (i = 0; i < pellets.length; i++){
        const pl = pellets[i];
        if (pl.t < 0) continue;
        d = Math.hypot(pl.x - f.x, pl.y - f.y);
        if (d < bd){ bd = d; best = pl; }
      }
      if (best){
        dx = (best.x - f.x) / (bd || 1); dy = (best.y - f.y) / (bd || 1);
        fx += dx * 3.6; fy += dy * 3.6;
        const near = 150 * S;
        if (bd < near && bd > 26 * S){ k = f.swirl * 1.5 * (bd / near); fx += -dy * k; fy += dx * k; }
        vt = f.cruise * clamp(bd / (46 * S), 0.75, 3.1);
        fast = true; turn = 4.6;
        /* 抢食的时候，嘴一直贴在水面上 */
        f.mouth = Math.max(f.mouth, bd < near ? 0.6 : 0.3);
        if (bd < 9 * S + f.B * 0.06){
          best.dead = true;
          f.mouth = 1; f.chew = 0.4 + rnd() * 0.45;
          addRipple(best.x, best.y, 0.5, 24 * S + f.B * 0.1, true);
          plip(0.09, 520 + rnd() * 500);
        }
      }
    }
  } else if (f === follower){
    dx = ptr.x - f.x; dy = ptr.y - f.y; d = Math.hypot(dx, dy) || 1;
    if (d > f.B * 0.42){ fx += dx / d * 2.8; fy += dy / d * 2.8; }
    else { fx += -dy / d * 1.2 * f.swirl; fy += dx / d * 1.2 * f.swirl; }
    vt = f.cruise * clamp(d / (110 * S), 0.45, 2);
    turn = 2.8; fast = d > 170 * S;
    f.mouth = 0;
  } else if (f.retT > 0){
    if (f.retD > 0) f.retD -= dt;
    else {
      f.retT -= dt;
      dx = f.retX - f.x; dy = f.retY - f.y; d = Math.hypot(dx, dy) || 1;
      fx += dx / d * 1.1; fy += dy / d * 1.1;
      if (d < 50 * S) f.retT = 0;
    }
  }

  /* 抢食时水面上的小圆圈：吧嗒、吧嗒 */
  if (feeding && f.notice <= 0 && f.fleeT <= 0 && !outside){
    f.bloopT -= dt;
    if (f.bloopT <= 0){
      f.bloopT = 0.4 + rnd() * 0.75;
      addRipple(f.x + Math.cos(f.h) * f.B * 0.28, f.y + Math.sin(f.h) * f.B * 0.28, 0.5, (14 + f.B * 0.1) * S, true);
      if (rnd() < 0.5) plip(0.045, 460 + rnd() * 460);
    }
  }

  if (fast){
    f.speed += (vt - f.speed) * Math.min(1, dt * 3.4);
    f.thrust += (clamp(vt / f.cruise * 0.4, 0.4, 1) - f.thrust) * Math.min(1, dt * 5);
  } else {
    f.thrust *= Math.exp(-dt * 2.6);
    if (f.speed < vt * 0.62 && f.thrust < 0.22) f.thrust = 1;
    f.speed += (f.thrust * vt * 2.6 - f.speed * 0.6) * dt;
  }
  const dh = angd(Math.atan2(fy, fx), f.h);
  f.h += clamp(dh * 3, -turn, turn) * dt;
  f.x += Math.cos(f.h) * f.speed * dt;
  f.y += Math.sin(f.h) * f.speed * dt;
  f.phase += dt * (2.0 + 7.5 * f.thrust + f.speed / f.B * 3);
  f.paddle += dt * (2.6 + f.thrust);

  /* 没事的时候，偶尔浮上来张嘴喝口水 */
  f.gulp -= dt;
  if (f.gulp <= 0){
    f.gulp = 22 + rnd() * 40;
    if (!feeding && !outside && f.fleeT <= 0){
      f.mouth = 1;
      addRipple(f.x, f.y, 0.42, 22 * S + f.B * 0.1, true);
      plip(0.05, 600 + rnd() * 300);
    }
  }

  /* 脊梁像被拖着走的一串珠子 */
  const n = f.nodes, seg = f.B / (NSEG - 1);
  n[0] = f.x; n[1] = f.y;
  for (i = 1; i < NSEG; i++){
    dx = n[i * 2] - n[i * 2 - 2]; dy = n[i * 2 + 1] - n[i * 2 - 1];
    d = Math.hypot(dx, dy) || 1;
    n[i * 2] = n[i * 2 - 2] + dx / d * seg;
    n[i * 2 + 1] = n[i * 2 - 1] + dy / d * seg;
  }
}

const SP = { x: 0, y: 0, nx: 0, ny: 0 };
function spineAt(f, s){
  const t = s * (NSEG - 1), i = clamp(Math.floor(t), 0, NSEG - 2), fr = t - i;
  SP.x = f.px[i] + (f.px[i + 1] - f.px[i]) * fr;
  SP.y = f.py[i] + (f.py[i + 1] - f.py[i]) * fr;
  const g = clamp(fr, 0, 1);
  SP.nx = f.nx[i] + (f.nx[i + 1] - f.nx[i]) * g;
  SP.ny = f.ny[i] + (f.ny[i + 1] - f.ny[i]) * g;
  return SP;
}
function poseFish(f){
  const n = f.nodes;
  let i, tx, ty, d;
  const A = f.B * 0.062 * (0.3 + 0.7 * f.thrust);
  for (i = 0; i < NSEG; i++){
    const a = Math.max(0, i - 1), b = Math.min(NSEG - 1, i + 1);
    tx = n[b * 2] - n[a * 2]; ty = n[b * 2 + 1] - n[a * 2 + 1];
    d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;
    const s = i / (NSEG - 1);
    const off = A * (0.1 + s * s * 1.15) * Math.sin(f.phase - s * 5.2);
    f.px[i] = n[i * 2] - ty * off; f.py[i] = n[i * 2 + 1] + tx * off;
  }
  for (i = 0; i < NSEG; i++){
    const a2 = Math.max(0, i - 1), b2 = Math.min(NSEG - 1, i + 1);
    tx = f.px[b2] - f.px[a2]; ty = f.py[b2] - f.py[a2];
    d = Math.hypot(tx, ty) || 1;
    f.nx[i] = -ty / d; f.ny[i] = tx / d;
  }
  /* body outline */
  const o = f.out;
  for (i = 0; i < 12; i++){
    spineAt(f, PROF_S[i]);
    const w = PROF_W[i] * f.B;
    if (i === 0){ o[0] = SP.x; o[1] = SP.y; continue; }
    o[i * 2] = SP.x + SP.nx * w; o[i * 2 + 1] = SP.y + SP.ny * w;
    const k = 23 - i;
    o[k * 2] = SP.x - SP.nx * w; o[k * 2 + 1] = SP.y - SP.ny * w;
  }
}
function bodyPath(c, f){ c.beginPath(); smooth(c, f.out, 23); }
function tailPath(c, f){
  const e = NSEG - 1, bx = f.px[e], by = f.py[e];
  const nx = f.nx[e], ny = f.ny[e], tx = ny, ty = -nx;
  const sw = 0.62 * (0.35 + 0.65 * f.thrust) * Math.sin(f.phase - 6.1);
  const cs = Math.cos(sw), sn = Math.sin(sw);
  const dx = tx * cs - ty * sn, dy = tx * sn + ty * cs;
  const TL = f.B * 0.36 * f.tailK, spd = 0.5 + 0.13 * Math.sin(f.phase * 2 + 1) - 0.12 * f.thrust;
  const w = PROF_W[11] * f.B;
  const pt = (ang, len) => {
    const c2 = Math.cos(ang), s2 = Math.sin(ang);
    return [bx + (dx * c2 - dy * s2) * len, by + (dx * s2 + dy * c2) * len];
  };
  const tl = pt(spd, TL), tr = pt(-spd, TL * 0.94), no = pt(sw * 0.3, TL * 0.56);
  const c1 = pt(spd * 1.7, TL * 0.5), c2 = pt(spd * 0.55, TL * 0.9), c3 = pt(-spd * 0.55, TL * 0.86), c4 = pt(-spd * 1.7, TL * 0.5);
  c.beginPath();
  c.moveTo(bx + nx * w, by + ny * w);
  c.quadraticCurveTo(c1[0], c1[1], tl[0], tl[1]);
  c.quadraticCurveTo(c2[0], c2[1], no[0], no[1]);
  c.quadraticCurveTo(c3[0], c3[1], tr[0], tr[1]);
  c.quadraticCurveTo(c4[0], c4[1], bx - nx * w, by - ny * w);
  c.closePath();
  return [bx, by, tl, tr, no];
}
function finPath(c, f, s, side, ang, len, fat){
  spineAt(f, s);
  const nx = SP.nx, ny = SP.ny, tx = ny, ty = -nx, w = wprof(s) * f.B * 0.82;
  const ax = SP.x + nx * side * w, ay = SP.y + ny * side * w;
  const cs = Math.cos(ang), sn = Math.sin(ang);
  const dx = tx * cs + nx * side * sn, dy = ty * cs + ny * side * sn;
  const qx = -tx * sn + nx * side * cs, qy = -ty * sn + ny * side * cs;
  const tipx = ax + dx * len, tipy = ay + dy * len;
  c.beginPath();
  c.moveTo(ax - tx * len * 0.1, ay - ty * len * 0.1);
  c.quadraticCurveTo(ax + dx * len * 0.5 + qx * len * fat, ay + dy * len * 0.5 + qy * len * fat, tipx, tipy);
  c.quadraticCurveTo(ax + dx * len * 0.72 - qx * len * fat * 0.75, ay + dy * len * 0.72 - qy * len * fat * 0.75, ax + tx * len * 0.16, ay + ty * len * 0.16);
  c.closePath();
  return [ax, ay, tipx, tipy, qx, qy];
}
function pecAngle(f, side){
  return 1.0 + 0.36 * Math.sin(f.paddle + (side > 0 ? 0 : 2.1)) - 0.62 * f.thrust;
}

function drawFish(f){
  const c = ctx, B = f.B;
  let i, side;
  /* 先画半透明的鳍，带鳍条 */
  for (side = -1; side <= 1; side += 2){
    const r = finPath(c, f, 0.2, side, pecAngle(f, side), B * 0.24, 0.3);
    c.fillStyle = f.fin; c.fill();
    if (f.finDark){ c.fillStyle = 'rgba(27,27,27,.3)'; c.fill(); }
    c.strokeStyle = 'rgba(20,50,58,.13)'; c.lineWidth = 0.7;
    for (i = -1; i <= 1; i++){
      c.beginPath(); c.moveTo(r[0], r[1]);
      c.lineTo(lerp(r[0], r[2], 0.86) + r[4] * i * B * 0.035, lerp(r[1], r[3], 0.86) + r[5] * i * B * 0.035);
      c.stroke();
    }
    finPath(c, f, 0.56, side, 0.62 + 0.15 * Math.sin(f.paddle * 0.7 + side), B * 0.11, 0.32);
    c.fillStyle = f.fin; c.fill();
  }
  const tp = tailPath(c, f);
  c.fillStyle = f.fin; c.fill();
  if (f.variety === 'kohaku' || f.variety === 'showa'){
    const tg = c.createRadialGradient(tp[0], tp[1], 0, tp[0], tp[1], B * 0.3);
    tg.addColorStop(0, f.variety === 'showa' ? 'rgba(27,27,27,.5)' : 'rgba(242,107,33,.5)');
    tg.addColorStop(1, 'rgba(242,107,33,0)');
    c.fillStyle = tg; c.fill();
  }
  c.strokeStyle = 'rgba(20,50,58,.12)'; c.lineWidth = 0.7;
  for (i = 0; i <= 4; i++){
    const u = i / 4;
    let ex, ey;
    if (u < 0.5){ ex = lerp(tp[2][0], tp[4][0], u * 2); ey = lerp(tp[2][1], tp[4][1], u * 2); }
    else { ex = lerp(tp[4][0], tp[3][0], u * 2 - 1); ey = lerp(tp[4][1], tp[3][1], u * 2 - 1); }
    c.beginPath(); c.moveTo(tp[0], tp[1]); c.lineTo(lerp(tp[0], ex, 0.92), lerp(tp[1], ey, 0.92)); c.stroke();
  }

  /* 身子 */
  bodyPath(c, f);
  c.fillStyle = f.base; c.fill();
  c.save();
  c.clip();
  const pts = [];
  for (i = 0; i < f.blobs.length; i++){
    const b = f.blobs[i];
    pts.length = 0;
    for (let k = 0; k < 12; k++){
      const a = k / 12 * TAU, s = b.s + Math.cos(a) * b.rs * b.v[k], uu = b.u + Math.sin(a) * b.ru * b.v[k];
      spineAt(f, s);
      const w = wprof(clamp(s, 0.07, 0.94)) * B * uu;
      pts.push(SP.x + SP.nx * w, SP.y + SP.ny * w);
    }
    c.fillStyle = b.col;
    c.beginPath(); smooth(c, pts, 12); c.fill();
  }
  /* 边上一圈暗下去，身子才显得圆 */
  c.lineJoin = 'round';
  c.strokeStyle = f.variety === 'ogon' ? 'rgba(150,84,10,.34)' : 'rgba(20,50,58,.2)';
  c.lineWidth = B * 0.085;
  bodyPath(c, f); c.stroke();
  c.strokeStyle = f.variety === 'ogon' ? 'rgba(150,84,10,.2)' : 'rgba(20,50,58,.1)';
  c.lineWidth = B * 0.03;
  c.stroke();
  /* 背上一道湿亮的光 */
  c.lineCap = 'round';
  c.beginPath();
  for (i = 0; i <= 10; i++){
    spineAt(f, 0.06 + i * 0.07);
    const hx = SP.x - B * 0.012, hy = SP.y - B * 0.02;
    if (i) c.lineTo(hx, hy); else c.moveTo(hx, hy);
  }
  c.strokeStyle = f.variety === 'ogon' ? 'rgba(255,244,204,.6)' : 'rgba(255,255,255,.3)';
  c.lineWidth = B * 0.05; c.stroke();
  c.restore();

  /* 背鳍 */
  c.beginPath();
  for (i = 0; i <= 6; i++){
    spineAt(f, 0.3 + i * 0.055);
    if (i) c.lineTo(SP.x, SP.y); else c.moveTo(SP.x, SP.y);
  }
  c.strokeStyle = f.variety === 'ogon' ? 'rgba(150,84,10,.45)' : 'rgba(20,50,58,.22)';
  c.lineWidth = B * 0.016; c.stroke();
  c.lineCap = 'butt';

  /* 眼睛 */
  spineAt(f, 0.085);
  const ew = wprof(0.085) * B * 0.8, er = Math.max(1, B * 0.017);
  c.fillStyle = C.black;
  c.beginPath(); c.arc(SP.x + SP.nx * ew, SP.y + SP.ny * ew, er, 0, TAU); c.fill();
  c.beginPath(); c.arc(SP.x - SP.nx * ew, SP.y - SP.ny * ew, er, 0, TAU); c.fill();

  /* 浮到水面张开的嘴 */
  if (f.mouth > 0.02){
    const mo = Math.sin(Math.min(1, f.mouth) * Math.PI);
    spineAt(f, 0.004);
    const mr = B * 0.024 * mo + 0.35;
    c.fillStyle = 'rgba(238,186,192,' + (0.78 * mo) + ')';
    c.beginPath(); c.arc(SP.x, SP.y, mr * 1.35, 0, TAU); c.fill();
    c.fillStyle = 'rgba(74,38,38,' + (0.66 * mo) + ')';
    c.beginPath(); c.arc(SP.x, SP.y, mr * 0.68, 0, TAU); c.fill();
  }
}

/* =====================================================================
   睡莲、荷叶、落下来的叶子
   ===================================================================== */
function buildPads(){
  const r = rngf(313);
  pads.length = 0;
  const clusters = W < 620
    ? [[0.25, 0.32, 4, 1], [0.75, 0.63, 4, 0], [0.22, 0.84, 2, 0]]
    : [[0.19, 0.66, 5, 1], [0.69, 0.25, 4, 0], [0.8, 0.6, 3, 2]];
  clusters.forEach(cl => {
    const ax = cl[0] * W, ay = cl[1] * H, base = (44 + r() * 12) * S, start = r() * TAU;
    for (let i = 0; i < cl[2]; i++){
      const rad = i === 0 ? base : base * (0.48 + r() * 0.42);
      const a = start + i * 1.75 + r() * 0.5, d = i === 0 ? 0 : base + rad * (0.72 + r() * 0.3);
      const p = {
        ax: ax + Math.cos(a) * d, ay: ay + Math.sin(a) * d, r: rad, x: 0, y: 0,
        notch: r() * TAU, rot: 0, ph1: r() * TAU, ph2: r() * TAU, kind: r() > 0.5 ? 0 : 1,
        bob: 0, bobV: 0, ox: 0, oy: 0, vx: 0, vy: 0, lastRip: -1, flower: 0, seed: Math.floor(r() * 1e5),
        veins: 9 + Math.floor(r() * 5)
      };
      if (cl[3] === 1 && i === 1) p.flower = 1;
      if (cl[3] === 2 && i === 0) p.flower = 0.78;
      p.x = p.ax; p.y = p.ay;
      makePadSprite(p);
      pads.push(p);
    }
  });
}
function updatePads(dt){
  for (let i = 0; i < pads.length; i++){
    const p = pads[i], mt = calm ? 0.35 : 1;
    p.vx += (-p.ox * 1.4 - p.vx * 1.1) * dt; p.vy += (-p.oy * 1.4 - p.vy * 1.1) * dt;
    p.ox += p.vx * dt; p.oy += p.vy * dt;
    p.bobV += (-p.bob * 38 - p.bobV * 3.2) * dt; p.bob += p.bobV * dt;
    p.x = p.ax + Math.sin(T * 0.11 * mt + p.ph1) * 9 * S + p.ox;
    p.y = p.ay + Math.cos(T * 0.09 * mt + p.ph2) * 7 * S + p.oy;
    p.rot = Math.sin(T * 0.07 * mt + p.ph2) * 0.22 + p.ox * 0.01;
  }
}
function padPath(c, p, rad){
  const n0 = p.notch + p.rot;
  c.beginPath();
  c.moveTo(p.x, p.y);
  c.arc(p.x, p.y, rad, n0 + 0.16, n0 + TAU - 0.16);
  c.closePath();
}
/* 荷叶和荷花是画好的一张图，每帧只挪一下；不然每片叶子每帧都要重画几十片花瓣 */
function paintPadContent(c, p, rad){
  const n0 = p.notch;
  let i;
  c.beginPath();
  c.moveTo(0, 0);
  c.arc(0, 0, rad, n0 + 0.16, n0 + TAU - 0.16);
  c.closePath();
  const g = c.createRadialGradient(-rad * 0.25, -rad * 0.3, rad * 0.05, 0, 0, rad);
  if (p.kind){ g.addColorStop(0, C.padB); g.addColorStop(0.7, mix(C.padB, C.padA, 0.55)); g.addColorStop(1, C.padA); }
  else { g.addColorStop(0, mix(C.padB, C.padA, 0.4)); g.addColorStop(0.75, C.padA); g.addColorStop(1, mix(C.padA, C.deep, 0.22)); }
  c.fillStyle = g; c.fill();
  c.save(); c.clip();
  c.strokeStyle = 'rgba(191,227,208,.34)'; c.lineWidth = Math.max(0.6, rad * 0.018);
  for (i = 0; i < p.veins; i++){
    const a = n0 + 0.3 + i / (p.veins - 1) * (TAU - 0.6);
    c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(Math.cos(a + 0.08) * rad * 0.5, Math.sin(a + 0.08) * rad * 0.5, Math.cos(a) * rad * 0.94, Math.sin(a) * rad * 0.94);
    c.stroke();
  }
  c.lineWidth = rad * 0.1; c.strokeStyle = 'rgba(20,50,58,.14)';
  c.beginPath(); c.arc(-1, -1.5, rad, 0, TAU); c.stroke();
  c.lineWidth = rad * 0.05; c.strokeStyle = 'rgba(255,255,255,.3)';
  c.beginPath(); c.arc(1, 1.5, rad, Math.PI * 0.9, Math.PI * 1.9); c.stroke();
  c.restore();
  /* 叶子上的一颗水珠 */
  const r = rngf(p.seed);
  for (i = 0; i < 2; i++){
    const da = n0 + 1 + r() * 4, dd = rad * (0.25 + r() * 0.45), dr = Math.max(1.2, rad * (0.03 + r() * 0.035));
    const bx = Math.cos(da) * dd, by = Math.sin(da) * dd;
    c.fillStyle = 'rgba(20,50,58,.2)'; c.beginPath(); c.arc(bx + 0.6, by + 0.9, dr, 0, TAU); c.fill();
    c.fillStyle = 'rgba(214,240,226,.8)'; c.beginPath(); c.arc(bx, by, dr, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(bx - dr * 0.3, by - dr * 0.35, dr * 0.4, 0, TAU); c.fill();
  }
  if (p.flower) paintLotusContent(c, p, rad);
}
function petal(c, x, y, a, len, wid){
  const dx = Math.cos(a), dy = Math.sin(a), nx = -dy, ny = dx;
  c.beginPath();
  c.moveTo(x, y);
  c.quadraticCurveTo(x + dx * len * 0.5 + nx * wid, y + dy * len * 0.5 + ny * wid, x + dx * len, y + dy * len);
  c.quadraticCurveTo(x + dx * len * 0.5 - nx * wid, y + dy * len * 0.5 - ny * wid, x, y);
  c.closePath();
}
function paintLotusContent(c, p, rad){
  const R = rad * 0.6 * p.flower, x = Math.cos(p.notch + 2.6) * rad * 0.2, y = Math.sin(p.notch + 2.6) * rad * 0.2;
  let i, a;
  c.fillStyle = 'rgba(20,50,58,.2)';
  c.beginPath(); c.arc(x + R * 0.12, y + R * 0.2, R * 0.8, 0, TAU); c.fill();
  const layers = [[9, 1, 0.3, 0, 0], [8, 0.8, 0.27, 0.35, 0.3], [6, 0.58, 0.22, 0.2, 0.62], [5, 0.36, 0.16, 0.5, 0.82]];
  for (let l = 0; l < layers.length; l++){
    const L = layers[l];
    for (i = 0; i < L[0]; i++){
      a = L[3] + i / L[0] * TAU;
      const len = R * L[1], tipx = x + Math.cos(a) * len, tipy = y + Math.sin(a) * len;
      const g = c.createLinearGradient(x, y, tipx, tipy);
      g.addColorStop(0, mix(C.lotus, C.white, 0.75 + L[4] * 0.2));
      g.addColorStop(0.55, mix(C.lotus, C.white, 0.35 + L[4] * 0.4));
      g.addColorStop(1, mix(C.lotus, C.orange, 0.1 - L[4] * 0.1));
      petal(c, x, y, a, len, R * L[2]);
      c.fillStyle = g; c.fill();
      c.strokeStyle = 'rgba(190,110,130,.26)'; c.lineWidth = 0.6; c.stroke();
    }
  }
  c.fillStyle = C.yolk; c.beginPath(); c.arc(x, y, R * 0.15, 0, TAU); c.fill();
  c.fillStyle = mix(C.yolk, C.orange, 0.55);
  for (i = 0; i < 7; i++){ a = i / 7 * TAU; c.beginPath(); c.arc(x + Math.cos(a) * R * 0.09, y + Math.sin(a) * R * 0.09, Math.max(0.6, R * 0.022), 0, TAU); c.fill(); }
}
function makePadSprite(p){
  const D = Math.ceil(p.r * 2.9);
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(D * DPR); cv.height = Math.ceil(D * DPR);
  const c = cv.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.translate(D / 2, D / 2);
  paintPadContent(c, p, p.r);
  p.sprite = cv; p.spriteD = D;
}
function drawPad(p){
  const c = ctx, rad = p.r * (1 + p.bob * 0.05);
  /* 被顶起来的一圈水波 */
  const ab = Math.min(1, Math.abs(p.bob) * 1.4 + Math.abs(p.bobV) * 0.12);
  if (ab > 0.02){
    c.strokeStyle = 'rgba(255,255,255,' + (0.42 * ab) + ')'; c.lineWidth = 1.2;
    c.beginPath(); c.arc(p.x - 0.8, p.y - 1, rad + 4 + ab * 5, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(20,50,58,' + (0.16 * ab) + ')';
    c.beginPath(); c.arc(p.x + 1, p.y + 1.4, rad + 6 + ab * 5, 0, TAU); c.stroke();
  }
  const k = 1 + p.bob * 0.05;
  c.save();
  c.translate(p.x, p.y);
  c.rotate(p.rot);
  c.drawImage(p.sprite, -p.spriteD * k / 2, -p.spriteD * k / 2, p.spriteD * k, p.spriteD * k);
  c.restore();
}

/* ---------- 落进水里的枫叶 ---------- */
const LEAF = (() => {
  const lobes = [[-2.15, 0.5], [-1.12, 0.84], [0, 1], [1.12, 0.84], [2.15, 0.5]], p = [];
  for (let i = 0; i < 5; i++){
    const a = lobes[i][0], l = lobes[i][1];
    if (i === 0) p.push([a - 0.75, 0.2]);
    p.push([a - 0.46, l * 0.5], [a - 0.3, l * 0.56], [a - 0.3, l * 0.74], [a - 0.14, l * 0.76], [a, l], [a + 0.14, l * 0.76], [a + 0.3, l * 0.74], [a + 0.3, l * 0.56], [a + 0.46, l * 0.5]);
    if (i < 4) p.push([(a + lobes[i + 1][0]) / 2, 0.3]); else p.push([a + 0.75, 0.2]);
  }
  return { pts: p, lobes };
})();
function buildLeaves(){
  const r = rngf(58);
  leaves.length = 0;
  const spots = W < 620 ? [[0.7, 0.28], [0.44, 0.6], [0.8, 0.9]] : [[0.43, 0.2], [0.5, 0.78], [0.9, 0.42], [0.33, 0.44]];
  const cols = [C.orange, mix(C.orange, C.yolk, 0.7), mix(C.orange, C.black, 0.22), mix(C.yolk, C.orange, 0.35)];
  spots.forEach((s, i) => {
    leaves.push({ x: s[0] * W, y: s[1] * H, a: r() * TAU, va: (r() > 0.5 ? 1 : -1) * (0.05 + r() * 0.07), vx: (r() - 0.5) * 3, vy: (r() - 0.5) * 3, r: (21 + r() * 10) * S, col: cols[i % 4], lastRip: -1 });
  });
}
function leafPath(c, lf){
  c.beginPath();
  for (let i = 0; i < LEAF.pts.length; i++){
    const a = LEAF.pts[i][0] + lf.a, d = LEAF.pts[i][1] * lf.r;
    const x = lf.x + Math.cos(a) * d, y = lf.y + Math.sin(a) * d;
    if (i) c.lineTo(x, y); else c.moveTo(x, y);
  }
  c.closePath();
}
function drawLeaf(lf){
  const c = ctx;
  leafPath(c, lf);
  c.fillStyle = lf.col; c.fill();
  c.strokeStyle = 'rgba(20,50,58,.18)'; c.lineWidth = 0.7; c.stroke();
  c.strokeStyle = 'rgba(255,240,214,.5)'; c.lineWidth = 0.7;
  for (let i = 0; i < 5; i++){
    const a = LEAF.lobes[i][0] + lf.a, d = LEAF.lobes[i][1] * lf.r * 0.86;
    c.beginPath(); c.moveTo(lf.x, lf.y); c.lineTo(lf.x + Math.cos(a) * d, lf.y + Math.sin(a) * d); c.stroke();
  }
  c.strokeStyle = mix(C.orange, C.black, 0.45); c.lineWidth = 1;
  c.beginPath(); c.moveTo(lf.x, lf.y);
  c.quadraticCurveTo(lf.x + Math.cos(lf.a + Math.PI + 0.3) * lf.r * 0.3, lf.y + Math.sin(lf.a + Math.PI + 0.3) * lf.r * 0.3, lf.x + Math.cos(lf.a + Math.PI) * lf.r * 0.62, lf.y + Math.sin(lf.a + Math.PI) * lf.r * 0.62);
  c.stroke();
}
function updateLeaves(dt){
  const mt = calm ? 0.35 : 1;
  for (let i = 0; i < leaves.length; i++){
    const lf = leaves[i];
    lf.a += lf.va * dt * mt;
    lf.x += lf.vx * dt * mt; lf.y += lf.vy * dt * mt;
    lf.vx += (Math.sin(T * 0.05 + i * 2) * 2.2 - lf.vx) * dt * 0.3;
    lf.vy += (Math.cos(T * 0.04 + i * 3) * 2.2 - lf.vy) * dt * 0.3;
    const m = 70 * S;
    if (lf.x < m) lf.vx += 4 * dt;
    if (lf.x > W - m) lf.vx -= 4 * dt;
    if (lf.y < m) lf.vy += 4 * dt;
    if (lf.y > H - m) lf.vy -= 4 * dt;
    for (let k = 0; k < stones.length; k++){
      const s = stones[k], dx = lf.x - s.x, dy = lf.y - s.y, d = Math.hypot(dx, dy) || 1;
      if (d < s.r + lf.r + 14){ lf.vx += dx / d * 14 * dt; lf.vy += dy / d * 14 * dt; }
    }
  }
}

/* =====================================================================
   水面：波纹、鱼食
   ===================================================================== */
function addRipple(x, y, str, maxR, small, delay){
  if (ripples.length > 54) ripples.shift();
  ripples.push({ id: ++ripId, x, y, t: -(delay || 0), str, maxR, sp: (small ? 34 : 92) * S * (calm ? 0.5 : 1), rings: small ? 2 : 4, gap: (small ? 6 : 17) * S, small: !!small });
}
function tapWater(x, y){
  if (onStone(x, y)) return false;
  addRipple(x, y, calm ? 0.7 : 1, 240 * S, false);
  plip(0.2, 380 + rnd() * 160);
  const R = 185 * S;
  for (let i = 0; i < fish.length; i++){
    const f = fish[i], d = Math.hypot(f.x - x, f.y - y);
    if (d < R + f.B * 0.3 && f.enter <= 0){
      f.fleeA = Math.atan2(f.y - y, f.x - x) + (rnd() - 0.5) * 0.9;
      f.fleeT = 0.55 + rnd() * 0.45 + (1 - d / (R + f.B * 0.3)) * 0.4;
      f.thrust = 1;
      f.retX = x; f.retY = y; f.retT = 7; f.retD = 1.2 + rnd() * 1.6;
      if (f === follower) follower = null;
    }
  }
  return true;
}
function feedSpot(){
  const cands = [[0.5, 0.52], [0.5, 0.42], [0.42, 0.6], [0.58, 0.58], [0.5, 0.66], [0.38, 0.48], [0.62, 0.44]];
  for (let i = 0; i < cands.length; i++){
    const x = W * cands[i][0], y = H * cands[i][1];
    if (!onStone(x, y)) return { x, y };
  }
  return { x: W * 0.5, y: H * 0.5 };
}
function feed(x, y){
  /* 按在石头上也不算白按：食会撒到石头旁边的水里 */
  for (let k = 0; k < 10 && onStone(x, y); k++){
    x += (W * 0.5 - x) * 0.16;
    y += (H * 0.5 - y) * 0.16;
  }
  if (onStone(x, y)) return false;
  if (pellets.length > 96) return true;
  const n = 26 + Math.floor(rnd() * 8);
  for (let i = 0; i < n; i++){
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * 118 * S + 4;
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
    if (onStone(px, py) || px < 8 || py < 8 || px > W - 8 || py > H - 8) continue;
    pellets.push({
      x: px, y: py, t: -(0.04 + rnd() * 0.85), r: (1.6 + rnd() * 1.5) * Math.max(0.8, S),
      vx: Math.cos(a) * 4, vy: Math.sin(a) * 4, age: 0, dead: false, landed: false, ph: rnd() * TAU
    });
  }
  for (let i = 0; i < fish.length; i++){
    const f = fish[i];
    f.notice = Math.hypot(f.x - x, f.y - y) / (760 * S) + rnd() * 0.5;
    f.retT = 0;
  }
  follower = null;
  addRipple(x, y, calm ? 0.55 : 0.8, 120 * S, false);
  plip(0.12, 300 + rnd() * 120);
  bumpFeed();
  return true;
}
function updateSurface(dt){
  let i, k, d;
  for (i = ripples.length - 1; i >= 0; i--){
    const r = ripples[i];
    r.t += dt;
    if (r.t * r.sp - (r.rings - 1) * r.gap > r.maxR){ ripples.splice(i, 1); continue; }
    if (r.small || r.t < 0) continue;
    const rad = r.t * r.sp, fade = 1 - rad / r.maxR;
    if (fade <= 0) continue;
    for (k = 0; k < pads.length; k++){
      const p = pads[k];
      if (p.lastRip === r.id) continue;
      d = Math.hypot(p.x - r.x, p.y - r.y);
      if (rad > d - p.r * 0.5){
        p.lastRip = r.id;
        p.bobV += 5.5 * fade * r.str;
        p.vx += (p.x - r.x) / (d || 1) * 13 * fade * S; p.vy += (p.y - r.y) / (d || 1) * 13 * fade * S;
      }
    }
    for (k = 0; k < leaves.length; k++){
      const lf = leaves[k];
      if (lf.lastRip === r.id) continue;
      d = Math.hypot(lf.x - r.x, lf.y - r.y);
      if (rad > d){
        lf.lastRip = r.id;
        lf.vx += (lf.x - r.x) / (d || 1) * 16 * fade; lf.vy += (lf.y - r.y) / (d || 1) * 16 * fade;
        lf.va += (rnd() - 0.5) * 0.5 * fade;
      }
    }
  }
  for (i = pellets.length - 1; i >= 0; i--){
    const pl = pellets[i];
    pl.t += dt;
    if (pl.t >= 0 && !pl.landed){
      pl.landed = true;
      addRipple(pl.x, pl.y, 0.34, 10 * S, true);
      if (rnd() > 0.5) plip(0.035, 1300 + rnd() * 900);
    }
    if (pl.t > 0){
      pl.age += dt;
      pl.x += pl.vx * dt; pl.y += pl.vy * dt; pl.vx *= 1 - dt * 0.8; pl.vy *= 1 - dt * 0.8;
      /* 鱼一挤，食就跟着漂 */
      for (k = 0; k < fish.length; k++){
        const f = fish[k];
        d = Math.hypot(pl.x - f.x, pl.y - f.y);
        if (d < f.B * 0.3 && d > 0.01){ pl.vx += Math.cos(f.h) * f.speed * dt * 0.5; pl.vy += Math.sin(f.h) * f.speed * dt * 0.5; }
      }
    }
    if (pl.dead || pl.age > 30) pellets.splice(i, 1);
  }
}
function drawRipples(){
  const c = ctx;
  for (let i = 0; i < ripples.length; i++){
    const r = ripples[i];
    if (r.t < 0) continue;
    const lead = r.t * r.sp;
    for (let j = 0; j < r.rings; j++){
      const rad = lead - j * r.gap;
      if (rad <= 0.5 || rad > r.maxR) continue;
      const k = rad / r.maxR, a = Math.pow(1 - k, 1.5) * r.str * (1 - j * 0.22) * Math.min(1, rad / (6 * S));
      const lw = r.small ? 0.9 : (1.5 + rad * 0.017) * (1 - j * 0.12);
      c.lineWidth = lw * 1.9;
      c.strokeStyle = 'rgba(20,50,58,' + (a * 0.3) + ')';
      c.beginPath(); c.arc(r.x + lw * 0.7, r.y + lw * 1.1, rad + lw * 1.2, 0, TAU); c.stroke();
      c.lineWidth = lw;
      c.strokeStyle = 'rgba(255,255,255,' + (a * 0.82) + ')';
      c.beginPath(); c.arc(r.x - lw * 0.5, r.y - lw * 0.8, rad, 0, TAU); c.stroke();
      if (!r.small){
        c.lineWidth = lw * 1.5;
        c.strokeStyle = 'rgba(255,255,255,' + (a * 0.5) + ')';
        c.beginPath(); c.arc(r.x - lw * 0.5, r.y - lw * 0.8, rad, Math.PI * 1.05, Math.PI * 1.6); c.stroke();
      }
    }
  }
}
function drawPellets(){
  const c = ctx;
  for (let i = 0; i < pellets.length; i++){
    const p = pellets[i];
    if (p.t < -0.22) continue;
    const fall = p.t < 0 ? -p.t / 0.22 : 0, rr = p.r * (1 + fall * 1.6), al = 1 - fall * 0.7;
    const bx = p.x + Math.sin(T * 1.3 + p.ph) * 0.6, by = p.y + Math.cos(T * 1.1 + p.ph) * 0.6 - fall * 14 * S;
    const sz = rr * 3.3;
    c.globalAlpha = al;
    c.drawImage(pelletSprite, bx - sz / 2, by - sz / 2, sz, sz);
  }
  c.globalAlpha = 1;
}

/* =====================================================================
   手指：点、按住、慢慢移
   ===================================================================== */
const ptr = { x: -999, y: -999, inside: false, mouse: false, down: false, dx: 0, dy: 0, dt: 0, held: false, spd: 0, slowT: 0, lx: 0, ly: 0, moved: 0, id: -1, hdt: 0, lastMove: -9 };
const lastTap = { t: -9, x: 0, y: 0 };
const HOLD = 0.46;
/* 手指按住会有一点点漂移，给孩子留宽一点 */
const DRAG = () => 18 * Math.max(1, S);
const TAPMAX = () => 20 * Math.max(1, S);

const tagEl = document.getElementById('fishTag');
const tagName = document.getElementById('tagName');
const tagSw = document.getElementById('tagSw');
let tagFish = null, tagT = 0;
const found = new Set();

function fishAt(x, y){
  let best = null, bd = 1e9;
  for (let i = 0; i < fish.length; i++){
    const f = fish[i];
    let d = 1e9;
    for (let j = 0; j < 3; j++){
      const n = j === 0 ? 0 : j === 1 ? 7 : 13;
      const dd = Math.hypot(f.nodes[n * 2] - x, f.nodes[n * 2 + 1] - y);
      if (dd < d) d = dd;
    }
    if (d < f.B * 0.42 + 8 && d < bd){ bd = d; best = f; }
  }
  return best;
}
function showTag(f){
  tagFish = f; tagT = 3.4;
  tagName.textContent = NAME[f.variety];
  tagSw.style.background = SWATCH[f.variety];
  tagEl.classList.add('on');
  if (!found.has(f.variety)){
    found.add(f.variety);
    if (found.size >= 4) finish('four');
    else toast('认识了一条 ' + NAME[f.variety]);
  }
}
function updateTag(dt){
  if (tagT > 0){
    tagT -= dt;
    if (tagT <= 0){ tagFish = null; tagEl.classList.remove('on'); }
  }
  if (!tagFish) return;
  const f = tagFish;
  const x = clamp(f.x, 66, W - 66), y = clamp(f.y - f.B * 0.55 - 12, 100, H - 42);
  tagEl.style.transform = 'translate(-50%,-100%) translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
}
function doTap(x, y){
  const hit = fishAt(x, y);
  if (hit){
    showTag(hit);
    addRipple(x, y, calm ? 0.45 : 0.6, 92 * S, true);
    hit.thrust = 1;
    hit.fleeA = Math.atan2(hit.y - y, hit.x - x) + (rnd() - 0.5);
    hit.fleeT = 0.26 + rnd() * 0.18;
    plip(0.07, 620 + rnd() * 240);
    finish('knock');
    return true;
  }
  if (onStone(x, y)) return false;
  const ok = tapWater(x, y);
  if (ok) finish('knock');
  return ok;
}
function doFeed(x, y){
  if (feed(x, y)) finish('feed');
}

cv.addEventListener('pointerdown', e => {
  if (e.button && e.button !== 0) return;
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.inside = true; ptr.mouse = e.pointerType === 'mouse';
  ptr.down = true; ptr.dx = ptr.x; ptr.dy = ptr.y; ptr.dt = 0; ptr.held = false; ptr.id = e.pointerId; ptr.hdt = performance.now(); ptr.slowT = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 抓不住就算了 */ }
});
cv.addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.inside = true; ptr.mouse = e.pointerType === 'mouse';
  ptr.moved += Math.hypot(ptr.x - ptr.lx, ptr.y - ptr.ly);
  ptr.lx = ptr.x; ptr.ly = ptr.y;
  ptr.lastMove = performance.now();
  /* 一动就不算按住了：在事件里当场取消，不等下一帧 */
  if (ptr.down && !ptr.held && Math.hypot(ptr.x - ptr.dx, ptr.y - ptr.dy) > DRAG()) ptr.hdt = -1;
});
function release(e, cancelled){
  if (!ptr.down) return;
  ptr.down = false;
  if (cancelled || ptr.held) return;
  if (Math.hypot(e.clientX - ptr.dx, e.clientY - ptr.dy) > TAPMAX()) return;
  const now = performance.now() / 1000;
  if (now - lastTap.t < 0.34 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 44){
    doFeed(e.clientX, e.clientY);
    lastTap.t = -9;
  } else {
    doTap(e.clientX, e.clientY);
    lastTap.t = now; lastTap.x = e.clientX; lastTap.y = e.clientY;
  }
}
cv.addEventListener('pointerup', e => { release(e, false); });
cv.addEventListener('pointercancel', e => { release(e, true); });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') ptr.inside = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { ptr.down = false; });
cv.addEventListener('keydown', e => {
  const x = W * (0.3 + rnd() * 0.4), y = H * (0.3 + rnd() * 0.4);
  if (e.key === 'Enter'){ doTap(x, y); e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'f' || e.key === 'F'){ doFeed(x, y); e.preventDefault(); }
});

function updatePointer(dt){
  const inst = ptr.moved / Math.max(dt, 0.001);
  ptr.moved = 0;
  ptr.spd += (inst - ptr.spd) * Math.min(1, dt * 6);
  if (ptr.down && !ptr.held){
    if (Math.hypot(ptr.x - ptr.dx, ptr.y - ptr.dy) > DRAG()){
      ptr.dt = -99; ptr.hdt = -1;
    } else if (ptr.hdt > 0){
      /* 用真实时间算按住多久：掉帧的时候也不会失灵 */
      const held = (performance.now() - ptr.hdt) / 1000;
      ptr.dt = held;
      if (held >= HOLD){ ptr.held = true; doFeed(ptr.dx, ptr.dy); }
    }
  }
  /* 手指慢慢移，最近的那条好奇的鱼会跟过来 */
  const active = ptr.inside && (ptr.mouse || ptr.down) && !pellets.length && !onStone(ptr.x, ptr.y);
  /* 真的还在慢慢挪才算，手指停住就不算了 */
  const moving = performance.now() - ptr.lastMove < 240;
  if (active && moving && ptr.spd > 4 && ptr.spd < 190) ptr.slowT += dt;
  else if (ptr.spd >= 190 || !active || !moving) ptr.slowT = 0;
  if (follower){
    followT -= dt;
    if (followT <= 0 || ptr.spd > 620 || !active || follower.fleeT > 0){
      follower = null; followClock = 0;
    } else {
      followClock += dt;
      if (followClock > 0.9) finish('follow');
    }
  } else if (ptr.slowT > 0.45){
    /* 手指慢下来一小会儿，最近的那条好奇的鱼就过来看看 */
    let best = null, bd = 460 * S;
    for (let i = 0; i < fish.length; i++){
      const f = fish[i], d = Math.hypot(f.x - ptr.x, f.y - ptr.y);
      if (d < bd && f.fleeT <= 0 && f.enter <= 0 && f !== follower){ bd = d; best = f; }
    }
    if (best){
      follower = best; followT = 9 + rnd() * 5; followClock = 0;
      ptr.slowT = 0;
    }
  } else followClock = 0;
}
function drawPointer(){
  if (!ptr.inside || (!ptr.mouse && !ptr.down)) return;
  const c = ctx, x = ptr.x, y = ptr.y, r = 8;
  if (ptr.mouse){
    c.lineWidth = 1.2;
    c.strokeStyle = 'rgba(8,32,34,.35)';
    c.beginPath(); c.arc(x + 0.7, y + 1, r + 0.8, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(255,252,240,.92)';
    c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
    c.fillStyle = 'rgba(255,252,240,.9)';
    c.beginPath(); c.arc(x, y, 1.4, 0, TAU); c.fill();
  }
  if (ptr.down && !ptr.held && ptr.dt > 0.12){
    const k = clamp((ptr.dt - 0.12) / (HOLD - 0.12), 0, 1), e2 = 1 - Math.pow(1 - k, 2), R = 18 + (ptr.mouse ? 0 : 14);
    c.lineCap = 'round'; c.lineWidth = 2;
    c.strokeStyle = 'rgba(8,32,34,.22)';
    c.beginPath(); c.arc(ptr.dx, ptr.dy, R, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(242,196,107,.96)';
    c.beginPath(); c.arc(ptr.dx, ptr.dy, R, -Math.PI / 2, -Math.PI / 2 + TAU * e2); c.stroke();
    c.lineCap = 'butt';
  }
}

/* =====================================================================
   声音：水声和吧嗒声，默认是关的
   ===================================================================== */
let AC = null, master = null, noiseBuf = null, soundOn = false, trickle = 0;
const sBtn = document.getElementById('sound'), sLabel = document.getElementById('soundLabel');
function initAudio(){
  const A = window.AudioContext || window.webkitAudioContext;
  if (!A) return false;
  AC = new A();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const len = AC.sampleRate * 2;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let b = 0;
  for (let i = 0; i < len; i++){ b = b * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = b; }
  const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.6;
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 520;
  const g = AC.createGain(); g.gain.value = 0.07;
  const lfo = AC.createOscillator(); lfo.frequency.value = 0.17;
  const lg = AC.createGain(); lg.gain.value = 460;
  const lfo2 = AC.createOscillator(); lfo2.frequency.value = 0.29;
  const lg2 = AC.createGain(); lg2.gain.value = 0.025;
  lfo.connect(lg); lg.connect(bp.frequency); lfo2.connect(lg2); lg2.connect(g.gain);
  src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(master);
  src.start(); lfo.start(); lfo2.start();
  return true;
}
function plip(vol, base){
  if (!soundOn || !AC) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base * 2.3, t + 0.075);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.2);
  const n = AC.createBufferSource(); n.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = base * 3.2; f.Q.value = 1.4;
  const ng = AC.createGain();
  ng.gain.setValueAtTime(vol * 0.7, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
  n.connect(f); f.connect(ng); ng.connect(master);
  n.start(t, Math.random() * 1.5, 0.07);
}
function setSound(on){
  if (on && !AC && !initAudio()) return;
  soundOn = on;
  sBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  sLabel.textContent = on ? '声音 开' : '声音';
  if (!AC) return;
  const t = AC.currentTime;
  master.gain.cancelScheduledValues(t);
  master.gain.setTargetAtTime(on ? 0.8 : 0, t, on ? 0.4 : 0.15);
  if (on) AC.resume();
}
sBtn.addEventListener('click', () => setSound(!soundOn));

/* =====================================================================
   孩子的那一层：提示、四件小事、小抽屉、计数器
   ===================================================================== */
const $id = id => document.getElementById(id);
const TASKS = [
  { id: 'knock', t: '敲一下水面，看波纹散开', h: '轻轻点一下就好' },
  { id: 'feed', t: '撒一把鱼食，看鱼围过来', h: '按住水面，或者按右下角的「喂一把」' },
  { id: 'follow', t: '让一条鱼跟着你的手指游', h: '手指贴着水面慢慢移，别太快' },
  { id: 'four', t: '找齐四种锦鲤（红白、昭和、黄金、丹顶）', h: '点一点鱼背，它会告诉你名字' }
];
const doneTasks = new Set();
try { JSON.parse(localStorage.getItem('koi-tasks') || '[]').forEach(k => doneTasks.add(k)); } catch (e) { /* 存不了也没关系 */ }
const tasksEl = $id('tasks'), taskCountEl = $id('taskCount'), taskCountEl2 = $id('taskCount2');

function renderTasks(){
  if (!tasksEl) return;
  tasksEl.innerHTML = TASKS.map(t => '<div class="task' + (doneTasks.has(t.id) ? ' done' : '') + '" data-id="' + t.id + '">' +
    '<span class="tick" aria-hidden="true">✓</span><p>' + t.t + '<small>' + t.h + '</small></p></div>').join('');
  if (taskCountEl) taskCountEl.textContent = doneTasks.size + '/4';
  if (taskCountEl2) taskCountEl2.textContent = doneTasks.size + ' / 4';
}
let followHintShown = false;
function finish(id){
  if (doneTasks.has(id) || !TASKS.some(t => t.id === id)) return;
  doneTasks.add(id);
  renderTasks();
  try { localStorage.setItem('koi-tasks', JSON.stringify([...doneTasks])); } catch (e) { /* 存不了也没关系 */ }
  toast('✓ ' + TASKS.find(t => t.id === id).t);
  if (id === 'knock' && !followHintShown && !doneTasks.has('follow')){
    followHintShown = true;
    setTimeout(() => { if (!sheetOpen) showHint('慢慢移动手指，<b>鱼会跟着你</b>', 13000); }, 1500);
  }
  if (id === 'four') hideHint();
}
let toastTimer = 0;
function toast(msg){
  const el = $id('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ---------- 提示条：学会之后就退场 ---------- */
const hintEl = $id('hint');
let hintGone = false, hintTimer = 0;
function hideHint(){
  if (!hintEl) return;
  hintGone = true;
  hintEl.classList.add('gone');
  clearTimeout(hintTimer);
}
function showHint(html, ms){
  if (!hintEl) return;
  hintEl.innerHTML = '<span class="dot" aria-hidden="true"></span>' + html;
  hintEl.classList.remove('gone');
  hintGone = false;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(hideHint, ms || 14000);
}
hintTimer = setTimeout(hideHint, 15000);

/* ---------- 小抽屉 ---------- */
const sheet = $id('sheet'), scrim = $id('scrim');
let sheetOpen = false;
function setSheet(open){
  sheetOpen = open;
  sheet.classList.toggle('open', open);
  scrim.classList.toggle('open', open);
  sheet.setAttribute('aria-hidden', open ? 'false' : 'true');
  if (open){
    const t = $id('toast');
    if (t) t.classList.remove('show');
    clearTimeout(toastTimer);
    hideHint();
  }
  if ('inert' in sheet) sheet.inert = !open;
  if (open) $id('closeTasks').focus({ preventScroll: true });
}
$id('openTasks').addEventListener('click', () => setSheet(true));
$id('closeTasks').addEventListener('click', () => setSheet(false));
scrim.addEventListener('click', () => setSheet(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) setSheet(false); });
if ('inert' in sheet) sheet.inert = true;

/* ---------- 今天喂了几次 ---------- */
let fedCount = 0;
const fedEl = $id('fedCount');
function bumpFeed(){
  fedCount++;
  if (!fedEl) return;
  fedEl.textContent = '今天喂了 ' + fedCount + ' 次';
  fedEl.classList.add('on');
}

/* ---------- 喂一把 ---------- */
$id('feedBtn').addEventListener('click', () => {
  const p = feedSpot();
  doFeed(p.x + (rnd() - 0.5) * 26, p.y + (rnd() - 0.5) * 26);
});

/* =====================================================================
   一帧
   ===================================================================== */
function update(dt){
  const fdt = dt * (calm ? 0.333 : 1);
  updatePointer(dt);
  for (let i = 0; i < fish.length; i++) updateFish(fish[i], fdt);
  for (let i = 0; i < fish.length; i++) poseFish(fish[i]);
  updatePads(dt); updateLeaves(dt); updateSurface(dt); updateTag(dt);
  if (soundOn){
    trickle -= dt;
    if (trickle <= 0){
      trickle = 0.4 + Math.random() * 1.4;
      plip(0.012 + Math.random() * 0.018, 900 + Math.random() * 1900);
    }
  }
}

let softShadow = null, pelletSprite = null;
function makePelletSprite(){
  pelletSprite = document.createElement('canvas');
  pelletSprite.width = 64; pelletSprite.height = 64;
  const c = pelletSprite.getContext('2d');
  c.save(); c.scale(2, 2); c.translate(16, 16);
  c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 0.8;
  c.beginPath(); c.arc(-0.4, -0.5, 11, 0, TAU); c.stroke();
  c.strokeStyle = 'rgba(20,50,58,.25)';
  c.beginPath(); c.arc(0.5, 0.7, 12.2, 0, TAU); c.stroke();
  c.fillStyle = mix(C.yolk, C.black, 0.42);
  c.beginPath(); c.arc(0, 0, 9.5, 0, TAU); c.fill();
  c.fillStyle = mix(C.yolk, C.white, 0.2);
  c.beginPath(); c.arc(-1.6, -1.6, 4.2, 0, TAU); c.fill();
  c.restore();
}
function makeSoftShadow(){
  softShadow = document.createElement('canvas');
  softShadow.width = 128; softShadow.height = 128;
  const c = softShadow.getContext('2d');
  const g = c.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0, 'rgba(20,50,58,1)');
  g.addColorStop(0.55, 'rgba(20,50,58,.78)');
  g.addColorStop(1, 'rgba(20,50,58,0)');
  c.fillStyle = g; c.beginPath(); c.arc(64, 64, 62, 0, TAU); c.fill();
}
function drawSoftShadow(x, y, ang, len, wid, alpha){
  const c = ctx;
  c.save();
  c.translate(x, y);
  c.rotate(ang);
  c.globalAlpha = alpha;
  c.drawImage(softShadow, -len / 2, -wid / 2, len, wid);
  c.restore();
}

function render(){
  const c = ctx;
  let i, f;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  c.drawImage(bgCv, 0, 0, W, H);

  /* 池底的影子：一张预先画软的图，按鱼的大小压扁了贴 */
  for (i = 0; i < fish.length; i++){
    f = fish[i];
    const dep = 0.45 + 0.55 * depthAt(clamp(f.x, 0, W), clamp(f.y, 0, H));
    const ox = (7 + f.B * 0.09) * dep + 3 * S, oy = (11 + f.B * 0.15) * dep + 4 * S;
    drawSoftShadow(f.x + ox, f.y + oy, f.h, f.B * 1.18, f.B * 0.64, 0.34 - dep * 0.1);
    drawSoftShadow(f.nodes[26] + ox * 0.8, f.nodes[27] + oy * 0.8, f.h, f.B * 0.5, f.B * 0.3, 0.2);
  }
  for (i = 0; i < pads.length; i++){
    const p = pads[i];
    drawSoftShadow(p.x + 15 * S, p.y + 23 * S, 0, p.r * 2.25, p.r * 2.1, 0.26);
  }
  for (i = 0; i < leaves.length; i++){
    const lf = leaves[i];
    drawSoftShadow(lf.x + 13 * S, lf.y + 20 * S, lf.a, lf.r * 2.4, lf.r * 2.2, 0.24);
  }

  for (i = 0; i < fish.length; i++) drawFish(fish[i]);

  /* 水光在池底和鱼背上一起晃 */
  c.globalCompositeOperation = 'lighter';
  c.globalAlpha = 0.58;
  c.drawImage(causCv, 0, 0, W, H);
  c.globalCompositeOperation = 'source-over';
  c.globalAlpha = 1;


  drawRipples();
  for (i = 0; i < leaves.length; i++) drawLeaf(leaves[i]);
  for (i = 0; i < pads.length; i++) drawPad(pads[i]);
  drawPellets();

  drawPointer();

  /* 一进来水面白得晃眼，像眼睛慢慢习惯太阳（按真实时间退，掉帧也不会拖很久） */
  const since = (performance.now() - bootAt) / 1000;
  const gl = calm ? 1.2 : 2.4;
  if (since < gl){
    const g = Math.pow(1 - since / gl, 2.3);
    c.fillStyle = 'rgba(255,255,255,' + g + ')';
    c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    c.fillStyle = 'rgba(255,250,232,' + (g * 0.55) + ')';
    c.fillRect(0, 0, W, H);
    c.globalCompositeOperation = 'source-over';
  }
}

function frame(now){
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (dt <= 0) return;
  T += dt; frameN++;
  update(dt);
  updateCaustics(T);
  render();
}

function resize(){
  const first = W === 0, ow = W, oh = H;
  W = Math.max(280, window.innerWidth);
  H = Math.max(280, window.innerHeight);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  M = Math.min(W, H);
  S = clamp(M / 820, 0.6, 1.3);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  buildStones(); paintStones(); paintFloor(); composeBackground(); setupCaustics();
  buildPads(); buildLeaves();
  if (first){
    const n = W * H < 480000 ? 9 : 11;
    for (let i = 0; i < n; i++) fish.push(makeFish(i));
    /* 一打开就该是一池活鱼，而不是先看见一片空水 */
    for (let i = 0; i < fish.length; i++){
      const f = fish[i];
      let px = W * 0.5, py = H * 0.5;
      for (let tries = 0; tries < 24; tries++){
        px = W * (0.16 + rnd() * 0.68);
        py = H * (0.16 + rnd() * 0.68);
        if (onStone(px, py)) continue;
        let ok = true;
        for (let j = 0; j < i; j++){
          const o = fish[j];
          if (Math.hypot(o.x - px, o.y - py) < (o.B + f.B) * 0.6){ ok = false; break; }
        }
        if (ok) break;
      }
      f.x = px; f.y = py;
      f.h = rnd() * TAU;
      f.enter = 0;
      f.speed = f.cruise * (calm ? 0.6 : 1.2);
      f.thrust = 0.4;
      const seg = f.B / (NSEG - 1);
      for (let k = 0; k < NSEG; k++){
        f.nodes[k * 2] = f.x - Math.cos(f.h) * seg * k;
        f.nodes[k * 2 + 1] = f.y - Math.sin(f.h) * seg * k;
      }
    }
    for (let i = 0; i < fish.length; i++) poseFish(fish[i]);
  } else {
    for (let k = 0; k < fish.length; k++){
      const f = fish[k], nx = f.x / ow * W, ny = f.y / oh * H, dx = nx - f.x, dy = ny - f.y;
      f.x = nx; f.y = ny;
      for (let j = 0; j < NSEG; j++){ f.nodes[j * 2] += dx; f.nodes[j * 2 + 1] += dy; }
    }
    pellets.length = 0; ripples.length = 0; follower = null;
  }
}

let rz = 0;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => { resize(); if (!raf){ update(0.001); render(); } }, 90);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    if (AC && soundOn) AC.suspend();
  } else if (!raf){
    last = performance.now();
    raf = requestAnimationFrame(frame);
    if (AC && soundOn) AC.resume();
  }
});
function motionChanged(){
  calm = mq.matches;
  updateCaustics(T);
}
if (mq.addEventListener) mq.addEventListener('change', motionChanged);
else if (mq.addListener) mq.addListener(motionChanged);

makeSoftShadow();
makePelletSprite();
renderTasks();
resize();
last = performance.now();
raf = requestAnimationFrame(frame);

/* 留给自动化测试看的一点点窗口（不参与画面） */
/* 只在 ?debug 时暴露一点内部状态给自动化测试，孩子看到的页面里没有 */
if (location.search.indexOf('debug') >= 0){
  window.__koi = { fish, doneTasks, found, fishAt, feedSpot, ptr, get sheetOpen(){ return sheetOpen; }, get fed(){ return fedCount; }, get follower(){ return follower; }, get followClock(){ return followClock; }, get running(){ return !!raf; } };
}
})();
</script>
